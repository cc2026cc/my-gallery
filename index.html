<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>荣昌陶艺 · 个人作品展厅</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500&family=Noto+Serif+SC:wght@400;600;900&display=swap" rel="stylesheet">

    <style>
        /* ================= 视觉与交互风格 (宣纸黄主题) ================= */
        :root {
            --bg-color: #F7F4ED; /* 宣纸黄 */
            --text-dark: #2c2c2c; 
            --text-light: #666666;
            --accent-color: #8b5a2b; 
        }

        body, html {
            margin: 0;
            padding: 0;
            background-color: var(--bg-color);
            color: var(--text-dark);
            font-family: 'Noto Sans SC', sans-serif;
            scroll-behavior: smooth;
        }

        h1, h2, h3, .serif {
            font-family: 'Noto Serif SC', serif;
            font-weight: 600;
        }

        /* 全新首屏展示 (画廊排版) */
        .hero {
            max-width: 1200px;
            margin: 0 auto;
            padding: 60px 20px 40px 20px;
            text-align: center;
            animation: fadeIn 1s ease-out;
        }

        .hero-text h1 {
            font-size: 2.5rem;
            letter-spacing: 0.1em;
            margin-bottom: 15px;
        }

        .hero-text p {
            font-size: 1.1rem;
            color: var(--text-light);
            max-width: 600px;
            margin: 0 auto 40px auto;
            line-height: 1.8;
        }

        .hero-image img {
            width: 100%;
            max-height: 60vh;
            object-fit: cover;
            border-radius: 4px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.08);
        }

        /* 瀑布流 */
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 40px 20px;
        }

        .gallery-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 30px;
            opacity: 0;
            transition: opacity 1s ease-in;
        }

        .product-card {
            cursor: pointer;
            transition: transform 0.4s ease;
            position: relative;
            background: #fff; /* 卡片加一点白底，让宣纸黄背景衬托出来 */
            padding: 10px;
            border-radius: 4px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.03);
        }

        .product-card:hover { transform: translateY(-5px); box-shadow: 0 8px 20px rgba(0,0,0,0.08); }

        .product-card img {
            width: 100%;
            aspect-ratio: 1 / 1;
            object-fit: cover;
            border-radius: 2px;
        }

        .product-info {
            padding: 15px 5px 5px 5px;
            text-align: center;
        }
        .product-info h3 { margin: 0; font-size: 1.1rem; }

        /* 详情模态框 */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: var(--bg-color); /* 详情页也是宣纸黄 */
            z-index: 1000;
            overflow-y: auto;
            animation: fadeIn 0.3s;
        }

        /* 修复：固定的关闭按钮 */
        .close-btn {
            position: fixed;
            top: 20px; right: 30px;
            font-size: 2.5rem;
            cursor: pointer;
            color: var(--text-dark);
            z-index: 1001;
            background: rgba(247, 244, 237, 0.8);
            width: 40px; height: 40px;
            line-height: 35px;
            text-align: center;
            border-radius: 50%;
        }

        .modal-content {
            max-width: 1000px;
            margin: 60px auto;
            padding: 20px;
            display: flex;
            flex-wrap: wrap;
            gap: 40px;
        }

        .modal-images { flex: 1; min-width: 300px; }
        .modal-images img {
            width: 100%;
            margin-bottom: 20px;
            border-radius: 4px;
            cursor: zoom-in; /* 提示可以点击放大 */
            transition: opacity 0.3s;
        }
        .modal-images img:hover { opacity: 0.9; }

        .modal-text {
            flex: 1;
            min-width: 300px;
            position: sticky;
            top: 60px;
            height: fit-content;
        }

        .modal-text h2 { font-size: 2rem; margin-top: 0; border-bottom: 1px solid #ddd; padding-bottom: 15px; }
        .modal-text p { line-height: 1.8; color: var(--text-light); white-space: pre-wrap; }

        .btn-wechat {
            display: inline-block;
            margin-top: 30px;
            padding: 12px 25px;
            background-color: var(--text-dark);
            color: #fff;
            text-decoration: none;
            border-radius: 2px;
            cursor: pointer;
            transition: background 0.3s;
        }
        .btn-wechat:hover { background-color: var(--accent-color); }

        /* 新增：单图全屏放大 (Lightbox) */
        .lightbox {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.95);
            z-index: 2000;
            justify-content: center;
            align-items: center;
            cursor: zoom-out;
        }
        .lightbox img {
            max-width: 90%;
            max-height: 90vh;
            object-fit: contain;
            box-shadow: 0 0 20px rgba(0,0,0,0.5);
        }

        footer { text-align: center; padding: 40px 20px; font-size: 0.85rem; color: #999; border-top: 1px solid #ddd; margin-top: 50px; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        #loading { text-align: center; padding: 50px; color: var(--text-light); }
    </style>
</head>
<body>

    <!-- 全新首屏 -->
    <div class="hero">
        <div class="hero-text">
            <h1>荣昌陶艺</h1>
            <p class="serif">泥火交融，凝结匠心。每一件作品，都是与时间的对话。</p>
        </div>
        <div class="hero-image">
            <!-- 这里读取您上传在根目录的 hero.jpg -->
            <img src="hero.jpg" alt="荣昌陶艺特写" onerror="this.src='https://images.unsplash.com/photo-1610701596007-11502861dcfa?q=80&w=2000&auto=format&fit=crop'; this.onerror=null; console.log('未找到hero.jpg，使用默认图');">
        </div>
    </div>

    <div class="container">
        <div id="loading">正在从云端读取展厅数据，请稍候...<br><span style="font-size:12px">（若图片加载慢，建议后续压缩图片大小）</span></div>
        <div class="gallery-grid" id="gallery"></div>
    </div>

    <!-- 详情弹窗 -->
    <div id="product-modal" class="modal">
        <div class="close-btn" onclick="closeModal()">×</div>
        <div class="modal-content">
            <div class="modal-images" id="modal-images"></div>
            <div class="modal-text">
                <h2 id="modal-title">加载中...</h2>
                <p id="modal-desc"></p>
                <div class="btn-wechat" onclick="copyWechat()">结缘咨询 (复制微信号 cjq678)</div>
            </div>
        </div>
    </div>

    <!-- 单图放大灯箱 -->
    <div id="lightbox" class="lightbox" onclick="closeLightbox()">
        <img id="lightbox-img" src="" alt="大图">
    </div>

    <footer>
        <p>© 2024 cc2026cc All Rights Reserved. 荣昌陶艺个人线上展厅</p>
        <p style="font-size: 0.75rem; margin-top: 10px;">隐私声明：本站仅作陈列展示。为优化浏览体验，本站可能使用统计工具记录页面访问量与滚动深度，但不收集任何可识别个人身份的信息。</p>
    </footer>

    <script>
        const GITHUB_USERNAME = "cc2026cc"; 
        const REPO_NAME = "my-gallery"; 

        const apiBase = `https://api.github.com/repos/${GITHUB_USERNAME}/${REPO_NAME}/contents/products`;
        const rawBase = `https://raw.githubusercontent.com/${GITHUB_USERNAME}/${REPO_NAME}/main/products`;

        async function initGallery() {
            const galleryElement = document.getElementById('gallery');
            const loadingElement = document.getElementById('loading');

            try {
                const response = await fetch(apiBase);
                if (!response.ok) throw new Error("无法读取目录");
                const folders = await response.json();

                for (let folder of folders) {
                    if (folder.type === 'dir') {
                        const folderName = folder.name;
                        const folderRes = await fetch(`${apiBase}/${encodeURIComponent(folderName)}`);
                        const files = await folderRes.json();

                        let images = [];
                        let infoUrl = '';

                        files.forEach(file => {
                            const ext = file.name.split('.').pop().toLowerCase();
                            if (['jpg', 'jpeg', 'png', 'webp'].includes(ext)) {
                                images.push(file.name);
                            } else if (ext === 'txt') {
                                infoUrl = file.download_url;
                            }
                        });

                        images.sort();
                        const coverImg = images.length > 0 ? `${rawBase}/${encodeURIComponent(folderName)}/${encodeURIComponent(images[0])}` : '';

                        if (coverImg) {
                            createCard(folderName, coverImg, images, infoUrl);
                        }
                    }
                }
                loadingElement.style.display = 'none';
                galleryElement.style.opacity = '1';

            } catch (error) {
                loadingElement.innerHTML = `⚠️ 数据读取失败，请检查文件夹命名是否含有无法解析的特殊字符。`;
            }
        }

        function createCard(folderName, coverUrl, allImages, infoUrl) {
            const gallery = document.getElementById('gallery');
            const card = document.createElement('div');
            card.className = 'product-card';
            
            const displayName = folderName.includes('-') ? folderName.split('-')[1] : folderName;

            card.innerHTML = `
                <img src="${coverUrl}" alt="${displayName}" loading="lazy">
                <div class="product-info">
                    <h3 class="serif">${displayName}</h3>
                </div>
            `;
            card.onclick = () => openModal(folderName, displayName, allImages, infoUrl);
            gallery.appendChild(card);
        }

        async function openModal(folderName, displayName, images, infoUrl) {
            const modal = document.getElementById('product-modal');
            const imgContainer = document.getElementById('modal-images');
            const titleEl = document.getElementById('modal-title');
            const descEl = document.getElementById('modal-desc');

            titleEl.innerText = displayName;
            imgContainer.innerHTML = '';
            descEl.innerText = '加载描述中...';
            modal.style.display = 'block';

            // 禁用底层页面滚动
            document.body.style.overflow = 'hidden';

            images.forEach(imgName => {
                const img = document.createElement('img');
                img.src = `${rawBase}/${encodeURIComponent(folderName)}/${encodeURIComponent(imgName)}`;
                img.loading = "lazy";
                // 新增：点击图片放大
                img.onclick = function() { openLightbox(this.src); };
                imgContainer.appendChild(img);
            });

            if (infoUrl) {
                try {
                    const txtRes = await fetch(infoUrl);
                    const textBuffer = await txtRes.arrayBuffer();
                    const decoder = new TextDecoder('utf-8');
                    let text = decoder.decode(textBuffer);
                    
                    let lines = text.split('\n');
                    if(lines.length > 1 && lines[0].length < 20) lines.shift(); 
                    descEl.innerText = lines.join('\n');
                } catch (e) {
                    descEl.innerText = '暂无详细描述。';
                }
            } else {
                descEl.innerText = '暂无详细描述。';
            }
        }

        function closeModal() {
            document.getElementById('product-modal').style.display = 'none';
            document.body.style.overflow = 'auto'; // 恢复底层页面滚动
        }

        // ============ 新增：灯箱功能 (点击放大) ============
        function openLightbox(imgSrc) {
            const lightbox = document.getElementById('lightbox');
            const lightboxImg = document.getElementById('lightbox-img');
            lightboxImg.src = imgSrc;
            lightbox.style.display = 'flex';
        }

        function closeLightbox() {
            document.getElementById('lightbox').style.display = 'none';
        }

        // ============ 修复：更强悍的微信内复制功能 ============
        function copyWechat() {
            const wechatId = "cjq678";
            
            // 现代浏览器的复制方法
            if (navigator.clipboard && window.isSecureContext) {
                navigator.clipboard.writeText(wechatId).then(() => {
                    alert("微信号 cjq678 已复制！请前往微信添加。");
                }).catch(err => {
                    fallbackCopyTextToClipboard(wechatId);
                });
            } else {
                // 手机微信等内置浏览器的备用方法
                fallbackCopyTextToClipboard(wechatId);
            }
        }

        function fallbackCopyTextToClipboard(text) {
            var textArea = document.createElement("textarea");
            textArea.value = text;
            // 避免滚动到页面底部
            textArea.style.top = "0";
            textArea.style.left = "0";
            textArea.style.position = "fixed";
            document.body.appendChild(textArea);
            textArea.focus();
            textArea.select();
            try {
                var successful = document.execCommand('copy');
                if (successful) {
                    alert("微信号 cjq678 已复制！请前往微信添加。");
                } else {
                    alert("复制失败，请手动记录微信号：cjq678");
                }
            } catch (err) {
                alert("当前环境不支持一键复制，请手动输入：cjq678");
            }
            document.body.removeChild(textArea);
        }

        initGallery();
    </script>
</body>
</html>
