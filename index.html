<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>荣昌陶 · 茶器 / 花器</title>
  <link rel="preconnect" href="https://api.github.com" crossorigin>
  <link rel="preconnect" href="https://raw.githubusercontent.com" crossorigin>
  
  <script>
    if (window.location.hash.substring(1)) {
      document.write('<style id="hide-home-style">#home{display:none!important}</style>');
    }
  </script>
  <noscript><style>.curtain,.glow,.embers{display:none}</style></noscript>

  <style>
    :root {
      --bg-color: #121212;
      --card-bg: #1e1e1e;
      --text-main: #f0e6d3;
      --text-light: #888888;
      --text-body: #d6c9b8;
      --accent-color: #d4a373;
      --border-color: #333333;
      --gold: #d8a85e;
      --gold-l: #eec98a;
      --ink: #f2e8d5;
      --serif: "Noto Serif SC","Songti SC","STSong",serif;
      --sans: -apple-system,BlinkMacSystemFont,"PingFang SC","MiSans","Noto Sans SC","Source Han Sans SC",sans-serif;
    }
    
    /* 全局盒模型重置：默认 content-box 会让 "width:100% + 内边距" 的元素比父容器
       宽出一截（窑门文字被裁的根因），border-box 让宽度含内边距，符合直觉 */
    *, *::before, *::after { box-sizing: border-box; }

    /* 手机端点按不要出现系统那块半透明蓝（手指滚动时擦过卡片也会闪一下）。
       该属性可继承，写在 html 上即可覆盖全站；下面再点名一次，
       防止某些浏览器对动态绑定点击的元素不继承。 */
    html, body { -webkit-tap-highlight-color: transparent; }
    a, button, img, [onclick],
    .door, .product-card, .pic, .pic-ph, .cat-bar, .cat-back, .gbtn, .close-btn, .lightbox {
      -webkit-tap-highlight-color: transparent;
    }

    body, html {
      margin: 0; padding: 0;
      background-color: #0a0908;
      color: var(--text-main);
      font-family: var(--sans);
      scroll-behavior: smooth;
    }
    
    h1, h2, h3, h4, h5, h6, .serif { font-family: var(--serif); font-weight: 600; }
    
    /* ===== 窑门双开 · 首页 ===== */
    #home { position: relative; }
    .stage { position: fixed; inset: 0; display: flex; flex-direction: column; }
    .door { position: relative; flex: 1; display: flex; flex-direction: column; justify-content: flex-end; overflow: hidden; cursor: pointer; transition: flex-grow .9s cubic-bezier(.42,0,.58,1) .08s; text-decoration: none; color: inherit; }
    .door-tea { flex: 1.35; }
    .door-clay { flex: 1; background: #1a0f08; align-items: flex-end; }
    .door-img { position: absolute; inset: -4%; width: 108%; height: 108%; object-fit: cover; transform: scale(1); transition: transform .6s cubic-bezier(.22,.8,.24,1); will-change: transform; }
    .shade { position: absolute; inset: 0; }
    .door-tea .shade { background: linear-gradient(180deg, rgba(14,10,6,.58), rgba(14,10,6,.06) 42%, rgba(14,10,6,.9)); }
    .door-clay .shade { background: linear-gradient(180deg, rgba(30,14,5,.82), rgba(30,14,5,.28) 42%, rgba(20,9,3,.92)); }
    .zone-body { position: relative; z-index: 7; padding: 0 28px 13vh; max-width: 680px; width: 100%; }
    .door-clay .zone-body { margin-left: auto; text-align: right; display: flex; flex-direction: column; align-items: flex-end; }
    .door h1 { font-size: clamp(40px, 5.6vw, 88px); font-weight: 600; letter-spacing: .08em; font-family: var(--serif); line-height: 1.15; margin: 0; }
    /* 两门标题都是 4 个字、对称同档；粗陶门仅 42.6% 宽，封顶 58px 防右缘被裁 */
    .door-clay h1 { font-size: clamp(34px, 4vw, 58px); }
    .meta { margin-top: 12px; font-size: clamp(12px, 1.05vw, 14px); letter-spacing: .08em; color: rgba(242,232,213,.72); min-height: 1.4em; }
    /* 门下方这句话分成两段：名字段 + 款数段。
       桌面连成一行（用 — 接）；窄屏让款数单独占一行、两行都靠右。
       原因：交给浏览器自动折行时，末行经常只剩一个「售」字（360px 屏 304px 宽差几像素就折），
       右对齐下孤字特别扎眼；拆段后断点完全可控，两行字数也均衡。
       \00a0 = 不换行空格，防止「等」和破折号被拆到两行。 */
    .meta-names::after { content: '\00a0\2014\00a0'; }
    @media (max-width: 899px) {
      .meta-names { display: block; }
      .meta-names::after { content: ''; }
      .meta-count { display: block; }
    }
    .go { display: inline-flex; align-items: center; gap: 10px; margin-top: 22px; padding: 11px 24px; border: 1px solid rgba(216,168,94,.5); border-radius: 999px; font-size: 13px; letter-spacing: .24em; color: var(--gold-l); transition: background .3s, color .3s, border-color .3s; }
    .go svg { width: 12px; height: 12px; }
    .seam { position: relative; flex: 0 0 1px; align-self: stretch; background: linear-gradient(90deg, transparent, rgba(216,168,94,.5) 12%, rgba(216,168,94,.5) 88%, transparent); z-index: 5; }
    .top { position: fixed; top: 0; left: 0; right: 0; display: flex; justify-content: space-between; align-items: center; gap: 16px; padding: calc(20px + env(safe-area-inset-top)) 32px 8px; z-index: 8; pointer-events: none; }
    .top b { font-size: 19px; font-weight: 600; letter-spacing: .5em; font-family: var(--serif); }
    .top .slogan { display: none; font-size: 11px; letter-spacing: .28em; color: rgba(242,232,213,.55); font-family: var(--serif); }
    /* 顶栏微信号=按钮（点击复制）。注意 .top 是 pointer-events:none（不挡门的点击），
       所以按钮必须自己把指针事件接回来，否则看着能点、实际点不动 */
    .top-wx { pointer-events: auto; display: inline-flex; align-items: center; gap: 7px; flex: 0 0 auto;
      background: rgba(22,16,10,.44); border: 1px solid rgba(216,168,94,.45); color: var(--gold);
      font-family: var(--sans); font-size: 12px; letter-spacing: .16em; padding: 7px 14px;
      border-radius: 999px; cursor: pointer; white-space: nowrap;
      backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
      transition: background .25s, color .25s, border-color .25s; }
    .top-wx:hover { background: var(--gold); border-color: var(--gold); color: #241a0c; }
    .top-wx:active { transform: scale(.97); }
    .top-wx svg { width: 13px; height: 13px; stroke: currentColor; stroke-width: 1.9; fill: none; stroke-linecap: round; stroke-linejoin: round; }
    @media (max-width: 899px) { .top-wx { font-size: 11px; letter-spacing: .1em; padding: 6px 12px; gap: 5px; } }
    .top span { font-size: 12px; letter-spacing: .16em; color: var(--gold); }
    .curtain { position: fixed; left: 0; right: 0; height: 50.8%; background: #100d0a; z-index: 20; transition: transform 1.15s cubic-bezier(.7,0,.2,1); pointer-events: auto; }
    .curtain-l { top: 0; border-bottom: 1px solid rgba(216,168,94,.25); }
    .curtain-r { bottom: 0; border-top: 1px solid rgba(216,168,94,.25); }
    body.ready .curtain-l { transform: translateY(-101%); }
    body.ready .curtain-r { transform: translateY(101%); }
    body.ready .curtain { pointer-events: none; }
    .glow { position: fixed; left: 50%; top: 50%; transform: translate(-50%,-50%); width: 70vmax; height: 70vmax; background: radial-gradient(circle, rgba(239,159,39,.26), rgba(216,90,48,.1) 42%, transparent 70%); z-index: 19; pointer-events: none; animation: fadeGlow 5.4s ease .3s forwards; }
    @keyframes fadeGlow { to { opacity: 0; } }
    .embers { position: fixed; inset: 0; z-index: 21; pointer-events: none; overflow: hidden; }
    .embers i { position: absolute; bottom: -8px; left: var(--l); width: 3px; height: 3px; border-radius: 50%; background: var(--gold-l); opacity: 0; animation: rise 5.1s ease-out var(--d) forwards; }
    @keyframes rise { 12% { opacity: .95; } 100% { transform: translateY(-52vh) scale(.3); opacity: 0; } }
    .door:focus-visible { outline: 2px solid var(--gold); outline-offset: -4px; }
    @media (max-width: 899px) {
      .door-clay { justify-content: flex-start; }
      .door-clay .zone-body { padding: 36px 28px 0; }
      /* 手机窄屏：两门标题分别限档，4 个字在任何窄屏都不会被裁 */
      .door-tea h1 { font-size: clamp(34px, 9vw, 46px); }
      .door-clay h1 { font-size: clamp(30px, 8vw, 40px); }
    }
    @media (hover: hover) {
      /* 悬停只做两件事：门幅微扩 + 门图缓慢放大。鼠标移动不再驱动任何动画 */
      .door:hover .door-img { transform: scale(1.05); }
      .door:hover .go { background: var(--gold); border-color: var(--gold); color: #1a1409; }
      /* 互斥 + 80ms 过渡死区：鼠标压在 1px 窑缝上时两扇门可能同时 :hover，
         flex 值反复横跳就是"中线抽搐"的根因；:not(:has()) 保证只有一个门响应 */
      .stage:has(.door-tea:hover):not(:has(.door-clay:hover)) .door-tea { flex: 1.4; }
      .stage:has(.door-tea:hover):not(:has(.door-clay:hover)) .door-clay { flex: 1; }
      .stage:has(.door-clay:hover):not(:has(.door-tea:hover)) .door-clay { flex: 1; }
      .stage:has(.door-clay:hover):not(:has(.door-tea:hover)) .door-tea { flex: 1.31; }
    }
    @media (min-width: 900px) {
      .stage { flex-direction: row; }
      .seam { background: linear-gradient(180deg, transparent, rgba(216,168,94,.5) 12%, rgba(216,168,94,.5) 88%, transparent); }
      .zone-body { padding: 0 6vw 15vh; }
      .top .slogan { display: block; }
    }
    /* ===== 常驻氛围（拟真 窑境版） ===== */
    .ambient { position: fixed; inset: 0; pointer-events: none; z-index: 6; overflow: hidden; }
    .kiln-glow { position: absolute; left: 50%; bottom: -12%; transform: translateX(-50%); width: 48vmax; height: 62vmax; background: radial-gradient(ellipse at 50% 100%, rgba(255,138,42,.18), rgba(255,92,32,.06) 46%, transparent 72%); animation: kilnBreath 6.5s ease-in-out infinite; }
    @keyframes kilnBreath { 0%,100% { opacity: .55; transform: translateX(-50%) scale(1); } 50% { opacity: 1; transform: translateX(-50%) scale(1.07); } }
    @keyframes emberFlash { 0%,42% { filter: brightness(1); } 52% { filter: brightness(2.1); } 62%,100% { filter: brightness(1); } }
    .embers-x i { position: absolute; bottom: -6px; left: var(--l); width: var(--s,3px); height: var(--s,3px); border-radius: 50%; background-color: #ffe6bb; box-shadow: 0 0 5px 1px rgba(255,190,110,.75); opacity: 0; animation: emberRise var(--t,7s) linear var(--d,0s) infinite; }
    @keyframes emberRise {
      0%   { transform: translate(0,0) scale(.8); opacity: 0; background-color: #ffe6bb; box-shadow: 0 0 4px 1px rgba(255,190,110,.8); }
      7%   { opacity: calc(var(--o,.7) * .6); }
      13%  { transform: translate(var(--wx1),-7vh) scale(1.05); opacity: calc(var(--o,.7) * .95); }
      19%  { opacity: calc(var(--o,.7) * .4); }
      29%  { transform: translate(var(--wx2),-21vh) scale(.9); opacity: calc(var(--o,.7) * .9); }
      36%  { opacity: calc(var(--o,.7) * .55); }
      47%  { transform: translate(var(--wx3),-38vh) scale(1.1); background-color: #ffab4d; box-shadow: 0 0 6px 1px rgba(255,140,50,.6); }
      55%  { opacity: calc(var(--o,.7) * .85); }
      63%  { transform: translate(var(--wx4),-56vh) scale(.85); opacity: calc(var(--o,.7) * .4); background-color: #e07b2a; }
      71%  { opacity: calc(var(--o,.7) * .7); }
      81%  { transform: translate(var(--wx5),-76vh) scale(1); background-color: #9c4416; box-shadow: 0 0 3px 0 rgba(160,70,30,.3); }
      88%  { opacity: calc(var(--o,.7) * .3); }
      100% { transform: translate(var(--wx6),-98vh) scale(.25); opacity: 0; background-color: rgba(70,35,18,0); box-shadow: 0 0 2px 0 rgba(80,40,20,0); }
    }

    .embers-x i { animation: emberRise var(--t,7s) linear var(--d,0s) infinite, emberFlash calc(var(--t,7s) * .6) ease-in var(--d,0s) infinite; }
    .ash-layer i { position: absolute; top: -10px; left: var(--l); width: var(--s,5px); height: var(--s,5px); border-radius: 46% 54% 52% 48% / 52% 48% 54% 46%; background: rgba(198,188,172,.5); opacity: 0; animation: ashFall var(--t,16s) linear var(--d,0s) infinite; }
    @keyframes ashFall {
      0%   { transform: translate(0,0) rotate(0deg); opacity: 0; }
      10%  { opacity: calc(var(--o,.32) * .9); }
      20%  { transform: translate(var(--ax1),14vh) rotate(70deg); }
      35%  { transform: translate(var(--ax2),30vh) rotate(130deg); opacity: calc(var(--o,.32) * .6); }
      50%  { transform: translate(var(--ax3),48vh) rotate(210deg); opacity: calc(var(--o,.32) * .95); }
      65%  { transform: translate(var(--ax4),64vh) rotate(280deg); opacity: calc(var(--o,.32) * .55); }
      80%  { transform: translate(var(--ax5),82vh) rotate(330deg); }
      92%  { opacity: calc(var(--o,.32) * .35); }
      100% { transform: translate(var(--ax6),102vh) rotate(395deg); opacity: 0; }
    }
    .ash-layer i:nth-child(3n+1) { transform-origin: 25% 75%; }
    .ash-layer i:nth-child(3n+2) { transform-origin: 70% 30%; }
    .ash-layer i:nth-child(3n) { transform-origin: 45% 55%; }
    .kiln-coals { position: absolute; left: 50%; bottom: -18%; transform: translateX(-50%); width: 60vmax; height: 40vmax; background: radial-gradient(ellipse at 50% 100%, rgba(255,96,24,.22), rgba(200,60,16,.08) 40%, transparent 70%); animation: kilnBreath 11s ease-in-out infinite reverse; }
    @media (max-width: 899px) {
      .embers-x i:nth-of-type(n+9), .ash-layer { display: none; }
    }

    @media (prefers-reduced-motion: reduce) {
      .curtain, .glow, .embers, .ambient { display: none; }
      .door, .door-img, .go { transition: none; }
    }

    /* ===== 展厅内景（分类视图） ===== */
    #cat-view { display: none; }
    #cat-view.on { display: block; }
    .cat-bar { display: flex; align-items: center; gap: 18px; margin-bottom: 30px; flex-wrap: wrap; }
    .cat-back { background: none; border: 1px solid rgba(216,168,94,.45); color: var(--gold-l); padding: 8px 18px; border-radius: 999px; font-size: 13px; letter-spacing: .18em; cursor: pointer; font-family: var(--sans); transition: background .25s, color .25s; }
    .cat-back:hover { background: var(--gold); color: #1a1409; border-color: var(--gold); }
    .cat-title { display: flex; align-items: baseline; gap: 14px; flex-wrap: wrap; }
    .cat-title h2 { margin: 0; font-size: 1.6rem; letter-spacing: .08em; }
    .cat-count { font-size: 12px; letter-spacing: .2em; color: var(--text-light); }
    
    /* ===== Gallery ===== */
    .container { max-width: 1200px; margin: 0 auto; padding: 40px 20px; }
    .gallery-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 25px; opacity: 0; transition: opacity 1s ease-in; }
    @media (max-width: 768px) {
      .gallery-grid { grid-template-columns: repeat(2, 1fr); gap: 15px; }
    }
    
    .product-card { cursor: pointer; transition: transform 0.4s ease, box-shadow 0.4s ease; background: var(--card-bg); padding: 8px; border-radius: 4px; box-shadow: 0 4px 15px rgba(0,0,0,0.5); }
    /* 上浮效果只在真正有鼠标的设备上生效：手机端点一下会一直"卡"在悬停态（卡片浮着不落回） */
    @media (hover: hover) and (pointer: fine) {
      .product-card:hover { transform: translateY(-5px); box-shadow: 0 8px 25px rgba(0,0,0,0.8); }
    }
    .product-card img { width: 100%; height: auto; aspect-ratio: 1 / 1; object-fit: cover; border-radius: 2px; display: block; }

    /* 1:1 占位框：进列表的瞬间所有产品都有等大方框 + 品名，缩略图到货后淡出揭图（全程零跳版） */
    .pic { position: relative; aspect-ratio: 1 / 1; overflow: hidden; background: #14110d; border-radius: 2px; }
    .pic-ph {
      position: absolute; inset: 0; z-index: 2;
      display: flex; align-items: center; justify-content: center;
      padding: 16%; text-align: center;
      font-size: clamp(12px, 3.4vw, 15px); line-height: 1.6; letter-spacing: .08em;
      color: rgba(232, 222, 206, .52);
      background: linear-gradient(135deg, #17140f, #100e0b);
      transition: opacity .5s ease; pointer-events: none;
    }
    .pic.is-loaded .pic-ph { opacity: 0; }
    .product-info { padding: 12px 5px 5px 5px; text-align: center; }
    .product-info h3 { margin: 0; font-size: 1.05rem; color: var(--text-main); }
    
    /* ===== Modal ===== */
    .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: var(--bg-color); z-index: 1000; overflow-y: auto; animation: fadeIn 0.3s; -webkit-overflow-scrolling: touch; }
    .close-btn { position: fixed; top: 20px; left: 20px; width: 36px; height: 36px; border-radius: 50%; background: rgba(0,0,0,0.4); backdrop-filter: blur(5px); -webkit-backdrop-filter: blur(5px); display: flex; justify-content: center; align-items: center; cursor: pointer; color: #fff; z-index: 1001; transition: background 0.3s, transform 0.2s; }
    .close-btn:hover { background: rgba(0,0,0,0.8); transform: scale(1.05); }
    .close-btn svg { width: 20px; height: 20px; stroke: currentColor; stroke-width: 2; fill: none; }
    .modal-content-dynamic { width: 100%; animation: fadeIn 0.4s; }
    
    /* ===== 详情页新版（展陈定稿）：首图与下图同宽同级 · 毛玻璃卡吸顶收缩 · 按图定框零跳变 ===== */
    /* 变量作用域=模态框（详情页只存在于模态内）；弧线同心定理见 .glass.pinned .gbtn 处 */
    #product-modal {
      --g-pad:13px 24px; --g-gap:14px; --g-name:19px; --g-price:20px; --g-price-s:12px;
      --g-btn:12.5px; --g-btn-pad:9px 17px; --g-hint:11.5px; --g-sold:10.5px; --g-bh:36px;
      /* --g-top = 吸顶位置。取值让吸顶后的小胶囊与左上角返回按钮（fixed top:20px 高36px → 中心 38px）
         严格同轴：38 - --g-hm/2。桌面 38-21=17，手机 38-19=19 */
      --g-mt:-64px; --g-mx:12px; --g-top:17px;
      --g-h:60px;
      /* 吸顶细长条：品名在收缩态隐去，只留价格+微信；
         弧心重合公式：「上下/右内边距 + 按钮半径 = 玻璃半径(=高/2)」桌面 7+14=21 ✓（玻璃无边框，见 .glass 注释） */
      --g-hm:42px; --g-mini-w:210px;
      --g-mpv:7px; --g-mpl:16px; --g-mgap:10px;
      --g-mprice:15px; --g-mbtn:11px; --g-mbtn-pad:0 12px; --g-msold:9px;
      --stream-gap:22px; --stream-top:26px; --prose-top:18px;
    }
    .dstage { max-width: 880px; margin: 0 auto; padding: 0 0 90px; }
    /* 首图：与下图完全同级——同宽、各自按原图宽高比成框，绝不裁切 */
    .dhero { position: relative; background: #000; }
    /* 图框：占位策略核心——开页即按图片真实宽高比占位，图片何时到、以何顺序到都不跳版 */
    .dframe { position: relative; width: 100%; background: #0d0a07; overflow: hidden; }
    .dframe::after { content: ""; position: absolute; inset: 0; background: linear-gradient(100deg, transparent 20%, rgba(201,160,106,.045) 50%, transparent 80%); background-size: 200% 100%; animation: dsweep 2.6s linear infinite; pointer-events: none; }
    .dframe.done::after { display: none; }
    @keyframes dsweep { from { background-position: 200% 0; } to { background-position: -100% 0; } }
    /* contain：任何情况下都不裁切图片；框型=原图宽高比时恰好满框、零留白 */
    .dframe img { width: 100%; height: 100%; object-fit: contain; opacity: 0; transition: opacity .55s ease; cursor: zoom-in; display: block; }
    .dframe img.in { opacity: 1; }
    
    /* ===== 独立透明 PNG 印章 ===== */
    img.sold-stamp-hero {
      position: absolute; top: 30px; right: 30px;
      /* 电脑端大小 50px */
      width: 50px; height: auto; 
      transform: rotate(-6deg);
      /* 恢复100%原图颜色 */
      opacity: 1; pointer-events: none;
      filter: drop-shadow(0 2px 5px rgba(0,0,0,0.3));
      z-index: 5;
    }
    @media (max-width: 768px) {
      img.sold-stamp-hero { 
        /* 手机端大小 30px */
        width: 30px; 
        top: 20px; right: 20px; 
      }
    }
    
    /* ===== 毛玻璃卡：品名 + 价格 + 微信按钮 =====
       .gslot 卡槽：sticky 吸顶 + 布局锚点（高度恒为整卡高，收缩时正文零跳版）
       .glass 卡片：绝对定位于槽内；初始满宽、骑首图内下缘；吸顶后收缩为右上角细长条 */
    .gslot { position: sticky; top: var(--g-top); z-index: 5; margin: var(--g-mt) var(--g-mx) 0; height: var(--g-h); pointer-events: none; }
    /* 磨砂玻璃的四条硬规矩（改样式时别破）：
       ① backdrop-filter（背景模糊）交给 ::before 那一层，并让它往外扩 3px。
          原因：模糊区的边缘天生和"没模糊的真实背景"对不齐，会在卡片最外圈留出
          1px 的接缝。外扩之后接缝落在卡片外，被父层的 overflow:hidden 裁掉。
       ② 【最容易踩的坑】不要用「整圈 1px 浅色描边」当边框（inset 0 0 0 1px 浅色）。
          它正好压在最外那 1px 上，和背景色一混就发灰——在有饱和度的背景（比如
          橙色陶土）上会被看成"一圈极细的暗色环"。像素实测：描边 16% 透明度时，
          边缘 RGB 从 144,57,4 变成 162,88,38（蓝通道翻十倍＝发灰）。
          结论：只留顶部 1px 高光（inset 0 1px 0），四周一律不画描边，靠底色与投影分界。
       ③ 不要写 border。有边框时模糊只铺到内边距盒，边框那一圈同样会成暗线；
          也不要写 inset 0 -1px 0 深色线（吸顶胶囊上会贴着下弧跑）。
       ④ 底色只用 40%~55% 的透明度：再高就成了实心黑卡（看不见后面的器物），
          再低文字会糊在亮图上。模糊度别超过 12px——太糊就只剩一片色块，
          看不出后面器物的轮廓（用户要求"透过玻璃条能看到背景色大致分界"）。 */
    .glass { position: absolute; top: 0; right: 0; width: 100%; height: var(--g-h); pointer-events: auto;
      display: flex; align-items: center; gap: var(--g-gap); padding: var(--g-pad);
      border-radius: 16px; white-space: nowrap; overflow: hidden;
      /* 外投影必须留在这一层：写进 ::after 会被 overflow:hidden 一起裁掉 */
      box-shadow: 0 14px 34px rgba(0,0,0,.34);
      /* 收缩节奏：整卡宽度收窄 .85s（缩小最慢的主动作），高度/内边距/圆角/间距 .6s 跟随。
         早先 .5/.4 收得太急，像"啪"一下弹走；放慢后有慢慢沉到右上角的从容感。
         改这里要同步 .gbtn 的 transition（按钮跟卡片一起收，不能各走各的）。 */
      transition: width .85s cubic-bezier(.22,1,.36,1), height .6s cubic-bezier(.22,1,.36,1),
        padding .6s cubic-bezier(.22,1,.36,1), border-radius .6s cubic-bezier(.22,1,.36,1),
        gap .6s cubic-bezier(.22,1,.36,1), box-shadow .6s ease; }
    /* 磨砂层（见注释①④）：外扩 3px，border-radius 跟随父层。
       模糊降到 9px、饱和度 1.25：能看清后面器物的大致轮廓与背景色分界，
       又不会糊成一片色块（26px 时背景完全看不出形状）。 */
    .glass::before { content: ''; position: absolute; inset: -3px; border-radius: inherit;
      background: linear-gradient(180deg, rgba(24,19,13,.40), rgba(10,8,5,.52));
      backdrop-filter: blur(6.3px) saturate(1.25); -webkit-backdrop-filter: blur(6.3px) saturate(1.25); }
    /* 只留顶部 1px 高光（见注释②：整圈浅色描边会在边缘混出一条发灰的暗环） */
    .glass::after { content: ''; position: absolute; inset: 0; border-radius: inherit; pointer-events: none;
      box-shadow: inset 0 1px 0 rgba(255,244,226,.10);
      transition: box-shadow .4s ease; }
    /* 文字/按钮必须压在磨砂层之上（::before 是定位元素，默认会盖住普通文字） */
    .glass > * { position: relative; z-index: 1; }
    /* 吸顶态：收缩为右上角细长条（右对齐，宽度过渡即"缩小"动画） */
    .glass.pinned { width: var(--g-mini-w); height: var(--g-hm); padding: var(--g-mpv) var(--g-mpv) var(--g-mpv) var(--g-mpl); gap: var(--g-mgap); border-radius: 999px;
      /* 小胶囊面积小、又压在图片上，透明度略收一点保可读 */
      box-shadow: 0 10px 26px rgba(0,0,0,.40); }
    .glass.pinned::before { background: linear-gradient(180deg, rgba(22,17,12,.50), rgba(10,8,5,.62)); }
    .glass.pinned::after { box-shadow: inset 0 1px 0 rgba(255,244,226,.09); }
    /* 品名一行、不换行；太长就省略号收尾（以前会溢出到微信按钮下面，字压字） */
    .glass h1 { font-family: var(--serif); font-size: var(--g-name); font-weight: 600; letter-spacing: .04em; color: var(--text-main); flex: 0 1 auto; min-width: 0; overflow: hidden; text-overflow: ellipsis; }
    /* 收缩态隐去品名：常驻条只留价格 + 微信（身份由页面本身承载） */
    .glass.pinned h1 { display: none; }
    .glass .sold-tag { flex: 0 0 auto; font-family: var(--serif); font-size: var(--g-sold); color: #c99a63; border: 1px solid rgba(201,160,106,.45); background: rgba(201,160,106,.10); padding: 2px 7px; border-radius: 4px; letter-spacing: .12em; }
    .glass.pinned .sold-tag { font-size: var(--g-msold); padding: 1px 5px; }
    .glass .price { flex: 0 0 auto; font-family: var(--serif); font-size: var(--g-price); color: var(--gold-l); line-height: 1; transition: font-size .4s; }
    .glass.pinned .price { font-size: var(--g-mprice); }
    .glass .price small { font-size: var(--g-price-s); color: var(--gold); margin-right: 1px; }

    /* ===== 微信按钮（毛玻璃卡内）===== */
    .gbtn { flex: 0 0 auto; margin-left: auto; height: var(--g-bh); border: 1px solid var(--gold); background: rgba(201,160,106,.12); color: var(--gold-l);
      font-size: var(--g-btn); padding: var(--g-btn-pad); border-radius: 6px; cursor: pointer; letter-spacing: .04em; white-space: nowrap;
      /* 收缩动画与玻璃卡同步：高/内边距/圆角 同为 .6s 同曲线（卡片 .85s 收宽，按钮跟手不失步） */
      transition: height .6s cubic-bezier(.22,1,.36,1), padding .6s cubic-bezier(.22,1,.36,1),
        border-radius .6s cubic-bezier(.22,1,.36,1), background .25s, color .25s; }
    .gbtn:hover { background: var(--gold); color: #241a0c; }
    .gbtn .hint { color: rgba(201,160,106,.55); font-size: var(--g-hint); margin-left: 5px; }
    .gbtn:hover .hint { color: rgba(36,26,12,.65); }
    .gbtn.sold { border-color: #5a4a33; color: var(--text-light); background: transparent; }
    .gbtn.sold:hover { background: #3a2f20; color: var(--text-main); }
    .gbtn.sold .hint { color: rgba(201,160,106,.45); }
    /* 细长条态：按钮收紧为胶囊，且与玻璃条外弧严格同心
       —— 玻璃已无 border（见 .glass 注释①），弧心重合公式跟着少掉 1px：
          高度 = 玻璃高 - 2×内边距 = 2×按钮半径（正胶囊）；
          半径 = 玻璃半径(高/2) - 内边距（弧心重合，弧间距恒定=内边距）
          桌面 42/2-7=14 vs 高(42-14)/2=14 ✓ */
    .glass.pinned .gbtn { padding: var(--g-mbtn-pad); font-size: var(--g-mbtn);
      height: calc(var(--g-hm) - 2 * var(--g-mpv));
      border-radius: calc(var(--g-hm) / 2 - var(--g-mpv)); }
    .glass.pinned .gbtn .hint { display: none; }
    /* 细长条态隐藏已售徽标（按钮文字已含"已售出"，避免重复）——只针对徽章，不碰 .gbtn.sold */
    .glass.pinned .sold-tag { display: none; }
    @media (max-width: 768px) {
      #product-modal {
        --g-pad:9px 12px; --g-gap:8px; --g-name:14px; --g-price:15px; --g-price-s:10px;
        --g-btn:10.5px; --g-btn-pad:6px 10px; --g-hint:9.5px; --g-sold:9px; --g-bh:28px;
        --g-mt:-52px; --g-mx:10px; --g-top:19px;
        --g-h:50px;
        --g-hm:38px; --g-mini-w:180px;
        --g-mpv:6px; --g-mpl:13px; --g-mgap:7px;
        --g-mprice:13px; --g-mbtn:10px; --g-mbtn-pad:0 11px; --g-msold:8.5px;
        --stream-gap:14px; --stream-top:20px; --prose-top:14px;
      }
      /* 手机细长条更激进：隐去品名，只留价格+微信（身份由页面本身承载） */
      .glass.pinned h1 { display: none; }
    }
    
    /* ===== 详情正文（无卡片，窄栏，与剩余图片列表同一层级平铺）===== */
    .prose { max-width: 640px; margin: var(--prose-top) auto 0; padding: 0 34px; position: relative; z-index: 1; }
    .prose .md-body, .prose .txt-body { margin-bottom: 0; }
    @media (max-width: 768px) { .prose { padding: 0 20px; } }
    
    /* ===== Markdown 顶级中文排印标准 ===== */
    .md-body { color: var(--text-body); font-size: 1.05rem; line-height: 2.1; font-family: var(--serif); font-weight: 400; margin-bottom: 30px; }
    .md-body p { margin: 0 0 1.5em 0; white-space: normal; text-align: justify; text-justify: inter-character; word-break: normal; line-break: strict; }
    
    .md-body h1, .md-body h2, .md-body h3, .md-body h4, .md-body h5, .md-body h6 { 
      font-family: 'Noto Serif SC', serif; color: var(--text-main); margin: 1.5em 0 0.8em 0; line-height: 1.4; 
    }
    .md-body h1 { font-size: 2.2em; text-align: center; }
    .md-body h2 { font-size: 1.6em; border-left: 5px solid var(--accent-color); padding-left: 15px; }
    .md-body h3 { font-size: 1.3em; color: var(--text-main); }
    .md-body h4 { font-size: 1.15em; }
    .md-body h5 { font-size: 1.05em; }
    .md-body h6 { font-size: 1em; color: var(--text-light); }
    
    .md-body strong { color: var(--accent-color); font-weight: 900; }
    .md-body em { font-style: italic; opacity: 0.8; }
    .md-body ul, .md-body ol { padding-left: 1.5em; margin: 1em 0; background: rgba(255,255,255,0.02); padding: 15px 15px 15px 35px; border-radius: 4px; text-align: justify; text-justify: inter-character; }
    .md-body li { margin-bottom: 0.5em; }
    .md-body li::marker { color: var(--accent-color); }
    .md-body hr { border: none; border-top: 1px dashed #444; margin: 2.5em auto; width: 50%; }
    .md-body blockquote { border-left: 3px solid var(--accent-color); margin: 1.5em 0; padding: 15px 20px; background: rgba(212, 163, 115, 0.08); border-radius: 0 4px 4px 0; color: var(--text-main); font-style: italic; text-align: justify; text-justify: inter-character; }
    
    .txt-body { color: var(--text-body); line-height: 2.1; white-space: pre-line; font-size: 1.05rem; text-align: justify; text-justify: inter-character; line-break: strict; font-family: var(--serif); }

    /* ===== 详情图流：与首图同宽同层级，间距收紧，无页码 ===== */
    .dstream { margin-top: var(--stream-top); padding: 0; display: flex; flex-direction: column; gap: var(--stream-gap); }
    .dstream .shot { position: relative; }
    /* 滚动淡入 */
    .rv { opacity: 0; transform: translateY(26px); transition: opacity .8s ease, transform .8s cubic-bezier(.22,.8,.3,1); }
    .rv.in { opacity: 1; transform: none; }

    /* ── 粗陶花盆独立展厅：交易必读告示牌（紧凑版） ──
       文案来自 products/粗陶花盆/【交易必读】.txt（运行时读取，逐字不改）；
       版式只做"压缩"：标题与复制按钮同一行，条目小字号紧行距，整块控制在首屏 1/4 以内 */
    .clay-notice { background: #3a2c18; border-left: 3px solid var(--gold); border-radius: 4px;
      padding: 11px 13px 12px; margin: 6px 0 22px; }
    .notice-head { display: flex; align-items: center; gap: 8px; margin-bottom: 7px; }
    .notice-tag { flex: 0 0 auto; background: var(--gold); color: #241a0c; font-size: 11px; letter-spacing: .22em; padding: 3px 8px 3px 10px; border-radius: 2px; }
    /* 复制按钮：在「交易必读」同一行的最右端 */
    .notice-wx { flex: 0 0 auto; margin-left: auto; border: 1px solid rgba(201,160,106,.55); background: rgba(201,160,106,.10);
      color: var(--gold-l); font-size: 11.5px; letter-spacing: .02em; padding: 3px 10px; border-radius: 999px;
      cursor: pointer; white-space: nowrap; line-height: 1.5; transition: background .25s, color .25s; }
    .notice-wx:hover { background: var(--gold); color: #241a0c; }
    .notice-wx:active { background: var(--gold); color: #241a0c; }
    .notice-list { list-style: none; counter-reset: cn; margin: 0; padding: 0; }
    .notice-list li { counter-increment: cn; position: relative; padding-left: 19px; font-size: 13px; line-height: 1.55; color: #e4d8c1; text-align: justify; }
    .notice-list li + li { margin-top: 4px; }
    .notice-list li::before { content: counter(cn); position: absolute; left: 0; top: 0; width: 14px; color: var(--gold); font-size: 11px; line-height: 1.85; font-family: var(--serif); }
    @media (max-width: 768px) {
      .clay-notice { padding: 9px 11px 10px; margin-bottom: 16px; }
      .notice-head { margin-bottom: 5px; gap: 6px; }
      .notice-tag { font-size: 10px; padding: 2px 7px 2px 8px; letter-spacing: .18em; }
      .notice-wx { font-size: 10.5px; padding: 2px 8px; }
      .notice-list li { font-size: 12px; line-height: 1.5; padding-left: 16px; }
      .notice-list li + li { margin-top: 3px; }
      .notice-list li::before { font-size: 10px; line-height: 1.8; }
    }

    /* ── 粗陶卡片：吊牌价格 + 方案三悬停（上浮 4px + 图缓放 4%） ── */
    .product-card.clay-card { background: none; padding: 0; box-shadow: none; border-radius: 0; }
    .product-card.clay-card:hover { transform: translateY(-4px); box-shadow: none; }
    .product-card.clay-card .clay-pic { position: relative; aspect-ratio: 1 / 1; overflow: hidden; background: #0d0d0d; border-radius: 2px; }
    .product-card.clay-card .clay-pic img { width: 100%; height: 100%; object-fit: cover; display: block; transition: transform .6s ease; }
    .product-card.clay-card:hover .clay-pic img { transform: scale(1.04); }
    .clay-price-inline { color: var(--gold-l); font-family: var(--serif); font-size: 15px; margin-left: 9px; letter-spacing: .02em; }
    .product-card.clay-card .product-info { text-align: left; padding: 13px 2px 0; }
    .product-card.clay-card .product-info h3 { font-size: 16px; }
    .clay-spec { font-size: 12.5px; color: var(--text-light); margin-top: 3px; }

    .end-of-content {
      text-align: center; padding: 10px 0 60px 0; color: var(--text-light);
      font-family: 'Noto Serif SC', serif; font-size: 0.9rem; letter-spacing: 3px;
      display: flex; align-items: center; justify-content: center; opacity: 0.5;
    }
    .end-of-content::before, .end-of-content::after {
      content: ""; height: 1px; width: 50px; background: var(--text-light);
      margin: 0 15px; opacity: 0.2;
    }
    
    /* ===== 轻提示（替代 alert：不打断、不抢焦点，手机上不会抖出键盘） ===== */
    .toast { position: fixed; left: 50%; bottom: 42px; transform: translate(-50%, 14px); z-index: 3000;
      max-width: 78vw; text-align: center; background: rgba(26,20,14,.94); color: var(--gold-l);
      border: 1px solid rgba(201,160,106,.45); border-radius: 999px; padding: 10px 20px;
      font-size: 13px; letter-spacing: .02em; opacity: 0; pointer-events: none;
      transition: opacity .22s ease, transform .22s ease; }
    .toast.on { opacity: 1; transform: translate(-50%, 0); }

    /* ===== Lightbox ===== */
    .lightbox { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,1); z-index: 2000; justify-content: center; align-items: center; overflow: hidden; }
    .lightbox img { width: auto; height: auto; max-width: 100%; max-height: 100vh; object-fit: contain; user-select: none; -webkit-user-drag: none; pointer-events: none; transform-origin: center center; will-change: transform; }
    
    /* ===== Footer ===== */
    footer { text-align: center; padding: 40px 20px; font-size: 0.85rem; color: var(--text-light); border-top: 1px solid var(--border-color); margin-top: 50px; }
    
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    #loading { text-align: center; padding: 50px; color: var(--text-light); }
  </style>
</head>

    // 使用单一会话时间戳，保证页面刷新时获取最新内容，但在同一次访问中各预加载组件能够共享缓存，避免重复请求带宽浪费
    const CACHE_STAMP = new Date().getTime(); 
    const preloadedImagesCache = new Set();
    
    function preloadImage(url) {
      if (!url || preloadedImagesCache.has(url)) return;
      preloadedImagesCache.add(url);
      const img = new Image();
      img.src = url;
    }

    // 带超时的 fetch：图片源（raw.githubusercontent）偶发挂起时，避免整个页面被拖死
    function fetchWithTimeout(url, ms) {
      const ctrl = new AbortController();
      const timer = setTimeout(() => ctrl.abort(), ms || 8000);
      return fetch(url, { signal: ctrl.signal }).finally(() => clearTimeout(timer));
    }

    // 交叉观察器：当产品卡片因滑动即将进入视口时，预加载该产品详情页的第一张大图
    const galleryPreloadObserver = new IntersectionObserver((entries, observer) => {
        entries.forEach(entry => {
          if (entry.isIntersecting) {
            const card = entry.target;
            const rel = card.dataset.rel;
            const firstImg = card.dataset.firstImage;
            if (rel && firstImg) {
              const url = `${rawBase}/${encRel(rel)}/${encodeURIComponent(firstImg)}?t=${CACHE_STAMP}`;
            // 延迟 500ms 执行，确保优先加载当前页面的缩略图，不抢占资源
            setTimeout(() => preloadImage(url), 500);
          }
          observer.unobserve(card); // 每张卡片只触发一次预加载
        }
      });
    }, { rootMargin: '300px 0px' }); // 距离视口 300px 时触发

    function renderMarkdown(md) {
      const lines = md.split('\n');
      let html = '';
      let inUl = false, inOl = false;
      
      const closeList = () => {
        if (inUl) { html += '</ul>'; inUl = false; }
        if (inOl) { html += '</ol>'; inOl = false; }
      };
      
      const inline = (str) => {
        let s = str;
        s = s.replace(/!\[.*?\]\(.*?\)/g, '');
        s = s.replace(/\[([^\]]+)\]\([^)]+\)/g, '$1');
        s = s.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>');
        s = s.replace(/__(.*?)__/g, '<strong>$1</strong>');
        s = s.replace(/\*(.*?)\*/g, '<em>$1</em>');
        s = s.replace(/_(.*?)_/g, '<em>$1</em>');
        s = s.replace(/~~(.*?)~~/g, '<del>$1</del>');
        return s;
      };
        
      for (let i = 0; i < lines.length; i++) {
        const line = lines[i];
        const trimmed = line.trim();
        
        if (/^(-{3,}|\*{3,}|_{3,})$/.test(trimmed)) {
          closeList(); html += '<hr>'; continue;
        }
        
        const hMatch = trimmed.match(/^(#{1,6})\s*(.+)/);
        if (hMatch) {
          closeList();
          const level = hMatch[1].length;
          html += `<h${level}>${inline(hMatch[2])}</h${level}>`;
          continue;
        }
        
        if (trimmed.startsWith('> ')) {
          closeList();
          html += `<blockquote>${inline(trimmed.slice(2))}</blockquote>`;
          continue;
        }
        
        if (/^[-*+]\s+/.test(trimmed)) {
          if (inOl) { html += '</ol>'; inOl = false; }
          if (!inUl) { html += '<ul>'; inUl = true; }
          html += `<li>${inline(trimmed.replace(/^[-*+]\s+/, ''))}</li>`;
          continue;
        }
        
        if (/^\d+\.\s+/.test(trimmed)) {
          if (inUl) { html += '</ul>'; inUl = false; }
          if (!inOl) { html += '<ol>'; inOl = true; }
          html += `<li>${inline(trimmed.replace(/^\d+\.\s+/, ''))}</li>`;
          continue;
        }
        
        if (trimmed === '') { closeList(); continue; }
        
        closeList();
        html += `<p>${inline(trimmed)}</p>`;
      }
      closeList();
      return html;
    }
    
    // ─────────────────────────────────────────
    // 窑门两侧的实时款数与在售名录
    // ─────────────────────────────────────────

    function updateDoorMetas() {
      CAT_ORDER.forEach(function (k) {
        const list = productsByCat[k];
        const el = document.getElementById(k === 'tea' ? 'meta-tea' : 'meta-clay');
        if (!el) return;
        if (!list.length) { el.textContent = '暂虚位以待'; return; }
        const names = list.slice(0, 3).map(function (p) { return p.cardName; }).join(' · ');
        // 拆成两个节点（不用 innerHTML，产品名走 textContent 防注入）：
        // 名字段 / 款数段，窄屏靠 CSS 让款数单独成行，避免末行只剩一个「售」字
        el.textContent = '';
        const sName = document.createElement('span');
        sName.className = 'meta-names';
        sName.textContent = names + (list.length > 3 ? ' 等' : '');
        const sCount = document.createElement('span');
        sCount.className = 'meta-count';
        sCount.textContent = list.length + ' 款在售';
        el.appendChild(sName);
        el.appendChild(sCount);
      });
    }

    // 粗陶花盆展厅顶部的交易必读告示牌
    // 文案唯一来源：products/粗陶花盆/【交易必读】.txt —— 运行时整份读进来，逐字照搬，不增不删。
    // NOTICE_FALLBACK 只在网络取不到文件时兜底，内容与那份 txt 完全一致。
    const NOTICE_URL = rawBase + '/' + encodeURIComponent('粗陶花盆') + '/' + encodeURIComponent('【交易必读】.txt') + '?t=' + CACHE_STAMP;
    const NOTICE_FALLBACK = [
      '盆重压秤，单发运费肉疼，3个起发（本店任意陶盆），可混搭，让你运费花得值。',
      '运费实收，不搞假包邮，物流报多少收多少。',
      '拒绝面交，精力有限，谢绝同城自提与线下探店，问地址不回，（单笔2万以上工程大单除外）。',
      '同城送货，近距离可安排送货，需收取合理运费。',
      '不议价，不抹零，包裹里可能会随机赠送花盆，全看心情。'
    ];
    let clayNoticeItems = NOTICE_FALLBACK;
    let clayNoticeFetched = false;

    function renderClayNotice() {
      const box = document.getElementById('clay-notice');
      if (currentCat !== 'clay') { box.innerHTML = ''; return; }
      box.innerHTML = '<div class="clay-notice">'
        + '<div class="notice-head">'
        + '<span class="notice-tag">交易必读</span>'
        + '<button class="notice-wx" type="button" onclick="copyWechat()">微信 CJQ678 · 复制</button>'
        + '</div>'
        + '<ol class="notice-list">'
        + clayNoticeItems.map(function (t) { return '<li>' + escapeHtml(t) + '</li>'; }).join('')
        + '</ol></div>';
    }

    function loadClayNotice() {
      if (clayNoticeFetched) return;
      clayNoticeFetched = true;
      fetch(NOTICE_URL, { cache: 'no-cache' })
        .then(function (r) { if (!r.ok) throw new Error('notice ' + r.status); return r.text(); })
        .then(function (txt) {
          const items = txt.replace(/^\uFEFF/, '').split(/\r?\n/)
            .map(function (s) { return s.trim(); })
            .filter(function (s) { return s && !/^【.*】$/.test(s); });  // 去掉【交易必读】这行标题
          if (items.length) { clayNoticeItems = items; renderClayNotice(); }
        })
        .catch(function () { /* 拉不到就用兜底文案，告示牌不能空着 */ });
    }

    function openCategory(catKey, push) {
      const cat = CATS[catKey];
      if (!cat) return;
      currentCat = catKey;
      document.getElementById('home').style.display = 'none';
      document.getElementById('cat-view').classList.add('on');
      document.getElementById('cat-title').textContent = cat.title;
      document.getElementById('cat-count').textContent = productsByCat[catKey].length ? productsByCat[catKey].length + ' 款' : '';
      // 粗陶展厅：顶部挂交易必读告示牌（先渲染兜底文案，再异步换成 txt 原文）；细陶展厅：清空
      if (catKey === 'clay') { renderClayNotice(); loadClayNotice(); }
      else { document.getElementById('clay-notice').innerHTML = ''; }
      const gallery = document.getElementById('gallery');
      gallery.innerHTML = '';
      gallery.style.opacity = '1';
      productsByCat[catKey].forEach(function (p) {
        createCard(p.rel, p.folderName, p.cardName, p.coverImg, p.images, p.infoUrl, p.infoType, p.price, p.spec);
      });
      const target = '#' + cat.hash;
      if (push !== false && window.location.hash !== target) {
        window.history.pushState(null, '', target);
      }
      window.scrollTo(0, 0);
    }

    function goHome() {
      currentCat = null;
      document.getElementById('cat-view').classList.remove('on');
      document.getElementById('home').style.display = '';
      if (window.location.hash) {
        window.history.pushState(null, '', window.location.pathname + window.location.search);
      }
    }

    function routeByHash(onLoad) {
      const hash = decodeURIComponent(window.location.hash.substring(1));
      if (hash !== currentModalFolder) {
        document.getElementById('product-modal').style.display = 'none';
        document.body.style.overflow = 'auto';
      }
      if (!hash) {
        if (!onLoad) goHome();
        return;
      }
      if (hash.indexOf('cat-') === 0) {
        const key = hash.slice(4);
        if (CATS[key]) { openCategory(key, false); return; }
      }
      // 产品深链：先进入所属展厅，再展开详情
      let foundCat = null, foundProduct = null;
      CAT_ORDER.forEach(function (k) {
        productsByCat[k].forEach(function (p) {
          if (p.folderName === hash) { foundCat = k; foundProduct = p; }
        });
      });
      if (foundProduct) {
        openCategory(foundCat, false);
        openModal(foundProduct.rel, foundProduct.folderName, foundProduct.cardName, foundProduct.images, foundProduct.infoUrl, foundProduct.infoType);
      } else if (!onLoad) {
        goHome();
      }
    }

    // ── 静态清单 products.json（发布时由 make_manifest.py 生成）──
    // 原来靠 api.github.com 现场列目录：匿名每 IP 每小时只有 60 次额度，
    // 进一次展厅要发 18 次请求（2 个分类 + 16 个产品文件夹），刷新几次就被限流，
    // 列表直接空白且不报错。改读自己域名下这一个 6KB 文件：1 次请求、无限流、更快。
    let manifestPromise = null;
    function getManifest() {
      if (!manifestPromise) {
        manifestPromise = fetchWithTimeout('products.json?t=' + CACHE_STAMP, 6000)
          .then(function (r) { return r.ok ? r.json() : null; })
          .catch(function () { return null; });
      }
      return manifestPromise;
    }

    // 图片排序两步走：
    // ① 「图片排序台」为这件产品存过顺序表 → 严格按表里的先后；
    // ② 表里没列到的（比如刚加的新图）按文件名规则排在后面。
    // 默认规则（老站规则，按文件名中的数字大小排）：
    // 末尾带 "-序号" 的（-0/-1/-2…-10）按序号数字升序；无序号排其后按文件名；序号相同按文件名。
    function defaultImgCmp(a, b) {
      function tailNo(n) { var m = n.match(/-(\d+)(\.[^.]+)?$/); return m ? parseInt(m[1], 10) : NaN; }
      var na = tailNo(a), nb = tailNo(b);
      var aHas = !isNaN(na), bHas = !isNaN(nb);
      if (aHas !== bHas) return aHas ? -1 : 1;
      if (aHas && bHas && na !== nb) return na - nb;
      return a < b ? -1 : (a > b ? 1 : 0);
    }
    function sortImages(rel, images) {
      var list = IMG_ORDER[rel];
      return (images || []).slice().sort(function (a, b) {
        var ia = list ? list.indexOf(a) : -1;
        var ib = list ? list.indexOf(b) : -1;
        if (ia >= 0 && ib >= 0) return ia - ib;
        if (ia >= 0) return -1;
        if (ib >= 0) return 1;
        return defaultImgCmp(a, b);
      });
    }

    // 用清单直接铺数据层（零 API 请求）
    function fillFromManifest(mf) {
      (mf.cats || []).forEach(function (c) {
        var bucket = productsByCat[c.key];
        if (!bucket) return;
        (c.products || []).forEach(function (p) {
          var rel = c.folder + '/' + p.folder;
          var images = sortImages(rel, p.images);
          var thumb = p.thumb || images[0] || '';
          if (!thumb) return;
          bucket.push({
            folderName: p.folder,
            rel: rel,
            cardName: p.name || (p.folder.indexOf('-') >= 0 ? p.folder.split('-').slice(1).join('-') : p.folder),
            coverImg: rawBase + '/' + encRel(rel) + '/' + encodeURIComponent(thumb) + '?t=' + CACHE_STAMP,
            images: images,
            infoUrl: p.info ? rawBase + '/' + encRel(rel) + '/' + encodeURIComponent(p.info) : '',
            infoType: p.info && /\.md$/i.test(p.info) ? 'md' : 'txt',
            price: p.price || '',
            spec: p.spec || ''
          });
        });
      });
    }

    async function initGallery() {
      const loadingElement = document.getElementById('loading');
      
      try {
        // 先读静态清单（1 次请求，6KB）；读不到再退回 GitHub API 老路子
        const mf = await getManifest();
        if (mf && mf.cats && mf.cats.length) fillFromManifest(mf);

        // 第一层：两个分类文件夹；第二层：分类下的每个子文件夹即一件产品
        for (const catKey of CAT_ORDER) {
          if (mf) break; // 清单已铺好，不再逐目录请求 GitHub API
          const catFolder = CATS[catKey].folder;
          let folders = [];
          try {
            const catRes = await fetch(`${apiBase}/${encodeURIComponent(catFolder)}`);
            if (catRes.ok) folders = await catRes.json();
          } catch (e) { folders = []; }
          
          for (let folder of folders) {
            if (folder.type !== 'dir') continue;
            
            const folderName = folder.name;
            const rel = catFolder + '/' + folderName;
            const folderRes = await fetch(`${apiBase}/${encRel(rel)}`);
            const files = await folderRes.json();
            
            let images = [];
            let infoUrl = '';
            let infoType = '';
            let thumbFilename = ''; // 用于存放特定的缩略图
            
            files.forEach(file => {
              const ext = file.name.split('.').pop().toLowerCase();
              if (['jpg', 'jpeg', 'png', 'webp', 'gif'].includes(ext)) {
                // 精准识别带有 thumb 结尾的文件
                const nameNoExt = file.name.substring(0, file.name.lastIndexOf('.')).toLowerCase();
                if (nameNoExt.endsWith('thumb')) {
                  thumbFilename = file.name; // 提取为缩略图
                } else {
                  images.push(file.name); // 其他图片推入详情页数组（剥离缩略图）
                }
              } else if (ext === 'md' || ext === 'txt') {
                // 产品文件夹只该有 info.txt；md 仅在没有 txt 时兜底
                if (ext === 'txt' || infoType === '') {
                  infoUrl = `${rawBase}/${encRel(rel)}/${encodeURIComponent(file.name)}`;
                  infoType = ext;
                }
              }
            });
            
            images = sortImages(rel, images);

            // 如果没有专门名为 thumb 的图片，则降级使用第一张图片作为封面保证页面不崩溃
            let finalThumb = thumbFilename;
            if (!finalThumb && images.length > 0) {
              finalThumb = images[0]; 
            }
              
            const coverImg = finalThumb 
              ? `${rawBase}/${encRel(rel)}/${encodeURIComponent(finalThumb)}?t=${CACHE_STAMP}` 
              : '';
              
            const cardName = folderName.includes('-')
              ? folderName.split('-').slice(1).join('-')
              : folderName;

            // 注意：粗陶的价格/规格不在这里拉取（串行 await 会拖慢整个展厅初始化），
            // 统一由 loadClayMeta() 在展厅渲染后后台并行补齐
            if (coverImg) {
              productsByCat[catKey].push({ folderName: folderName, rel: rel, cardName: cardName, coverImg: coverImg, images: images, infoUrl: infoUrl, infoType: infoType, price: '', spec: '' });
            }
          }
        }
        CAT_ORDER.forEach(function (k) {
          productsByCat[k].sort(function (a, b) { return a.folderName.localeCompare(b.folderName, 'zh'); });
        });
        updateDoorMetas();
        loadingElement.style.display = 'none';
        routeByHash(true);
        if (!mf) loadClayMeta(); // 清单里已含价格吊牌；只有走 API 时才需要后台补
      } catch (error) {
        loadingElement.innerHTML = '⚠ 数据读取失败。';
        document.getElementById('meta-tea').textContent = '展厅数据读取失败';
        document.getElementById('meta-clay').textContent = '展厅数据读取失败';
      }
    }
    
    // 价格吊牌压缩成一眼可读：多规格取最低价加「起」，并去掉「元/个」这类尾缀。
    // 例："14.9元/个" -> "14.9"；"小号10.9元、中号15.9元、大号21.9元" -> "10.9起"
    function tidyPrice(raw) {
      const s = String(raw == null ? '' : raw).trim().replace(/^¥\s*/, '');
      const nums = s.match(/\d+(?:\.\d+)?/g);
      if (!nums) return s;
      const uniq = nums.map(Number)
        .filter(function (n, i, a) { return a.indexOf(n) === i; })
        .sort(function (a, b) { return a - b; });
      const tiered = uniq.length > 1 || /、|起/.test(s);
      return uniq[0] + (tiered ? '起' : '');
    }

    // 粗陶花盆：后台并行读取各产品 info.txt 的「价格」与规格行，补齐卡片吊牌。
    // 故意不放进初始化主流程——raw 图片源偶发挂起，串行 await 会把整个展厅拖死。
    function loadClayMeta() {
      productsByCat.clay.forEach(function (p, idx) {
        if (!p.infoUrl) return;
        fetchWithTimeout(`${p.infoUrl}?t=${CACHE_STAMP}`, 8000)
          .then(function (r) { return r.arrayBuffer(); })
          .then(function (buf) {
            const itext = new TextDecoder('utf-8').decode(buf);
            const pm = itext.match(/^[ \t]*价格[:：]?\s*(.+)$/m);
            if (pm) p.price = tidyPrice(pm[1]);
            const sm = itext.match(/^[ \t]*(口径[^\n]*)$/m);
            if (sm) p.spec = sm[1].trim().replace(/，/g, ' · ');
            if (currentCat === 'clay') patchClayCard(idx, p);
          })
          .catch(function () { /* 读不到就不显示价格，不影响其他 */ });
      });
    }

    function patchClayCard(idx, p) {
      const cards = document.querySelectorAll('#gallery .product-card.clay-card');
      const card = cards[idx];
      if (!card) return;
      if (p.price && !card.querySelector('.clay-price-inline')) {
        const tag = document.createElement('span');
        tag.className = 'clay-price-inline';
        tag.textContent = '¥' + p.price;
        const h3 = card.querySelector('.product-info h3');
        if (h3) h3.appendChild(tag);
      }
      if (p.spec && !card.querySelector('.clay-spec')) {
        const s = document.createElement('div');
        s.className = 'clay-spec';
        s.textContent = p.spec;
        card.querySelector('.product-info').appendChild(s);
      }
    }

    function createCard(rel, folderName, cardName, coverUrl, allImages, infoUrl, infoType, price, spec) {
      const gallery = document.getElementById('gallery');
      const card = document.createElement('div');
      const isClay = currentCat === 'clay';
      card.className = isClay ? 'product-card clay-card' : 'product-card';

      if (isClay) {
        card.innerHTML = `
        <div class="clay-pic pic"><span class="pic-ph">${cardName}</span><img src="${coverUrl}" alt="${cardName}" loading="lazy" decoding="async" onload="this.parentNode.classList.add('is-loaded')" onerror="this.style.display='none'"></div>
        <div class="product-info"><h3 class="serif">${cardName}${price ? `<span class="clay-price-inline">¥${escapeHtml(tidyPrice(price))}</span>` : ''}</h3>${spec ? `<div class="clay-spec">${escapeHtml(spec)}</div>` : ''}</div>
      `;
      } else {
        card.innerHTML = `
        <div class="pic"><span class="pic-ph">${cardName}</span><img src="${coverUrl}" alt="${cardName}" loading="lazy" decoding="async" onload="this.parentNode.classList.add('is-loaded')" onerror="this.style.display='none'"></div>
        <div class="product-info"><h3 class="serif">${cardName}</h3></div>
      `;
      }
      
      // 绑定滑动进入屏幕预加载
      if (allImages && allImages.length > 0) {
        card.dataset.folder = folderName;
        card.dataset.rel = rel;
        card.dataset.firstImage = allImages[0];
        galleryPreloadObserver.observe(card);

        // 绑定鼠标悬停或触碰预加载（意图预判：此时用户极可能马上点击）
        const prefetchIntent = () => {
          preloadImage(`${rawBase}/${encRel(rel)}/${encodeURIComponent(allImages[0])}?t=${CACHE_STAMP}`);
        };
        card.addEventListener('mouseenter', prefetchIntent, {once: true});
        card.addEventListener('touchstart', prefetchIntent, {once: true, passive: true});
      }

      card.onclick = () => openModal(rel, folderName, cardName, allImages, infoUrl, infoType);
      gallery.appendChild(card);
    }
    
    async function openModal(rel, folderName, fallbackName, images, infoUrl, infoType) {
      currentModalFolder = folderName;
      if (decodeURIComponent(window.location.hash.substring(1)) !== folderName) {
        window.history.pushState(null, '', '#' + encodeURIComponent(folderName));
      }

      const modal = document.getElementById('product-modal');
      const dynamicBox = document.getElementById('modal-dynamic-box');

      modal.style.display = 'block';
      modal.scrollTop = 0; // 重置滚动：否则上次的吸顶态会在打开瞬间成立
      document.body.style.overflow = 'hidden';

      // 按图定框：尺寸表命中→开页即按原图比例占位；未命中→4:3 退化，加载后自校正
      const frame = (f, lazy) => {
        const d = IMG_DIMS[rel + '/' + f] || [4, 3];
        return `<div class="dframe" style="aspect-ratio:${d[0]}/${d[1]}"><img src="${rawBase}/${encRel(rel)}/${encodeURIComponent(f)}?t=${CACHE_STAMP}"${lazy ? ' loading="lazy"' : ''} decoding="async" onclick="openLightbox(this.src)" alt="${escapeHtml(fallbackName)}"></div>`;
      };

      // 第一步：立即渲染骨架——图片马上开始加载，不等信息文本（txt 网络挂起时不挡图）
      // 结构（细陶/粗陶统一）：首图 → 毛玻璃卡（吸顶收缩）→ 正文 → 剩余图片流 → 观止
      dynamicBox.innerHTML = `
        <div class="modal-content-dynamic">
          <div class="dstage">
            <div class="dhero" id="d-hero">${images.length ? frame(images[0]) : ''}</div>
            <div class="gslot">
              <div class="glass" id="d-glass">
                <h1>${escapeHtml(fallbackName)}</h1>
                <button class="gbtn" onclick="copyWechat()">微信号 CJQ678<span class="hint">（点击复制）</span></button>
              </div>
            </div>
            <div class="prose" id="d-text" style="display:none"></div>
            <div class="dstream">
              ${images.slice(1).map(f => `
                <div class="shot rv">${frame(f, true)}</div>`).join('')}
            </div>
            <div class="end-of-content">· 观止 ·</div>
          </div>
        </div>
      `;
      bindDetailFrames();

      // 后台静默预拉剩余图片（看完文字下滑时秒渲染）
      setTimeout(() => {
        for (let i = 1; i < images.length; i++) {
          preloadImage(`${rawBase}/${encRel(rel)}/${encodeURIComponent(images[i])}?t=${CACHE_STAMP}`);
        }
      }, 400);

      // 第二步：异步拉取介绍文字（带 8 秒超时，挂了也不影响图片）
      let docTitle = fallbackName;
      let bodyHTML = '';
      let isSold = false;
      let price = '';

      if (infoUrl) {
        try {
          const res = await fetchWithTimeout(`${infoUrl}?t=${CACHE_STAMP}`, 8000);
          const buffer = await res.arrayBuffer();
          const text = new TextDecoder('utf-8').decode(buffer);

          isSold = text.includes('已结缘');
          const lines = text.replace(/\r\n/g, '\n').replace(/\r/g, '\n').split('\n');
          const rawTitle = lines[0].replace(/^#+\s*/, '').replace(/[*_~`]/g, '').trim();
          // 首行若是「价格」行（介绍全文只有一行价格的产品），标题回退产品名——避免把价格当品名
          if (rawTitle && !/^[ \t]*价格[:：]?/.test(rawTitle)) docTitle = rawTitle;

          let bodyText = lines.slice(1).join('\n').trim();
          const pm = text.match(/^[ \t]*价格[:：]?\s*(.+)$/m);
          if (pm) price = tidyPrice(pm[1]);   // 多规格价取最低价 + 「起」，与列表吊牌一致
          bodyText = bodyText.replace(/^[ \t]*价格[:：]?.*$/m, '');
          // 剔除【交易必读】段（粗陶告示牌已在展厅顶部展示）与【已结缘】标记（印章+已售按钮已表达）
          const tIdx = bodyText.indexOf('【交易必读】');
          if (tIdx >= 0) bodyText = bodyText.slice(0, tIdx);
          bodyText = bodyText.replace(/【已结缘】/g, '').trim();

          if (!bodyText) {
            bodyHTML = '';
          } else if (infoType === 'md') {
            bodyHTML = `<div class="md-body">${renderMarkdown(bodyText)}</div>`;
          } else {
            bodyHTML = `<div class="txt-body">${escapeHtml(bodyText)}</div>`;
          }
        } catch (e) {
          bodyHTML = '<div class="txt-body">（介绍读取失败，详见图片展示）</div>';
        }
      } else {
        bodyHTML = '';
      }

      // 已切换到其他产品/关闭了详情，放弃回填
      if (currentModalFolder !== folderName) return;

      // 回填毛玻璃卡：品名 / 已售徽标 / 价格 / 微信按钮（卡片高度固定，内容变化零跳版）
      const glass = document.getElementById('d-glass');
      if (glass) {
        const h1 = glass.querySelector('h1');
        if (h1) h1.textContent = docTitle;
        const btn = glass.querySelector('.gbtn');
        if (isSold && btn) {
          btn.classList.add('sold');
          btn.innerHTML = '已售出 · 微信 CJQ678<span class="hint">（点击复制）</span>';
          const tag = document.createElement('span');
          tag.className = 'sold-tag';
          tag.textContent = '已售出';
          glass.insertBefore(tag, glass.firstChild);
        }
        if (price && btn) {
          const pe = document.createElement('span');
          pe.className = 'price';
          pe.innerHTML = '<small>¥</small>' + escapeHtml(price);
          glass.insertBefore(pe, btn);
        }
      }
      // 已结缘印章：叠在首图右上角（原站机制保留）
      if (isSold) {
        const heroBox = document.getElementById('d-hero');
        if (heroBox) heroBox.insertAdjacentHTML('beforeend',
          `<img src="${stampCDNUrl}?t=${CACHE_STAMP}" onerror="this.onerror=null; this.src='products/yinzhang.png';" class="sold-stamp-hero" alt="已售出">`);
      }
      const textEl = document.getElementById('d-text');
      if (textEl) {
        if (bodyHTML) { textEl.innerHTML = bodyHTML; textEl.style.display = ''; }
        else textEl.remove();
      }
      // 每次开详情都重算一次阈值：横竖屏切换会换 --g-top（12/17 与 10/19 两档）
      refreshPinTop();
      syncPin();
    }

    /* 详情图框：加载渐显 + 扫描显现 + 按真实宽高比自校正框型（尺寸表未命中也不裁切、不留边） */
    function bindDetailFrames() {
      const modal = document.getElementById('product-modal');
      modal.querySelectorAll('.dframe img').forEach(img => {
        const done = () => {
          img.classList.add('in');
          const frame = img.parentElement;
          frame.classList.add('done');
          const ar = img.naturalWidth + '/' + img.naturalHeight;
          if (frame.style.aspectRatio !== ar) frame.style.aspectRatio = ar;
        };
        if (img.complete && img.naturalWidth) done();
        else img.addEventListener('load', done, { once: true });
      });
      const io = new IntersectionObserver(es => {
        es.forEach(e => { if (e.isIntersecting) { e.target.classList.add('in'); io.unobserve(e.target); } });
      }, { threshold: .12 });
      modal.querySelectorAll('.rv').forEach(el => io.observe(el));
    }

    /* 吸顶收缩：卡槽触顶 → 卡片加 .pinned，CSS 过渡收缩为右上角细长条（模态容器内滚动） */
    let pinRaf = false;
    // 触顶阈值不能写死：吸顶后 slot.top 恒等于 --g-top（桌面 17 / 手机 19），
    // 阈值若比它小就永远判不成"触顶"，卡片会一直保持满宽不收缩。
    // 所以直接读 CSS 变量算，改 --g-top 时不用再动 JS。
    let pinTop = 0;
    function refreshPinTop() {
      const slot = document.querySelector('.gslot');
      if (!slot) return;
      const v = parseFloat(getComputedStyle(slot).getPropertyValue('--g-top'));
      pinTop = (isNaN(v) ? 12 : v) + 1;
    }
    function syncPin() {
      if (pinRaf) return;
      pinRaf = true;
      requestAnimationFrame(() => {
        pinRaf = false;
        const slot = document.querySelector('.gslot'), g = slot && slot.querySelector('.glass');
        if (!g) return;
        if (!pinTop) refreshPinTop();
        g.classList.toggle('pinned', slot.getBoundingClientRect().top <= pinTop);
      });
    }
    
    function escapeHtml(str) {
      return str.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
    }
    
    function closeModal() {
      currentModalFolder = null;
      const modal = document.getElementById('product-modal');
      modal.style.display = 'none';
      modal.scrollTop = 0;
      document.body.style.overflow = 'auto';

      const hideHomeStyle = document.getElementById('hide-home-style');
      if (hideHomeStyle) hideHomeStyle.remove();

      if (currentCat) {
        openCategory(currentCat);
      } else if (window.location.hash) {
        window.history.pushState(null, '', window.location.pathname + window.location.search);
      }
    }

    window.addEventListener('popstate', () => {
      routeByHash(false);
    });

    /* 详情页吸顶收缩：监听模态容器的滚动（详情存在于模态内，窗口本身不滚动） */
    document.getElementById('product-modal').addEventListener('scroll', syncPin, { passive: true });
    
    // ─────────────────────────────────────────
    // 终极灯箱缩放引擎
    // ─────────────────────────────────────────
    const lightbox = document.getElementById('lightbox');
    const lbImg = document.getElementById('lightbox-img');
    
    let lbScale = 1, currentX = 0, currentY = 0;
    let isDragging = false, hasMoved = false, isZooming = false;
    let startX = 0, startY = 0, initialX = 0, initialY = 0;
    let lbInitDist = 0, lbInitScale = 1;
    let interactionLock = false;
    let lastTouchWasZoom = false;
    
    function setTransition(slow) {
      if (slow) {
        lbImg.style.transition = 'transform 1.5s cubic-bezier(0.1, 0.8, 0.2, 1)';
      } else {
        lbImg.style.transition = 'transform 0.2s cubic-bezier(0.25, 0.46, 0.45, 0.94)';
      }
    }
    
    function updateTransform() {
      lbImg.style.transform = `translate(${currentX}px, ${currentY}px) scale(${lbScale})`;
    }
    
    function openLightbox(src) {
      lbImg.src = src;
      lightbox.style.display = 'flex';
      lbScale = 1; currentX = 0; currentY = 0;
      hasMoved = false; isZooming = false;
      interactionLock = false; lastTouchWasZoom = false;
      lbImg.style.transition = 'none';
      updateTransform();
      requestAnimationFrame(() => { setTransition(false); });
    }
    
    function closeLightbox() {
      lightbox.style.display = 'none';
    }
    
    document.addEventListener('mouseup', (e) => {
      if (lightbox.style.display !== 'flex') return;
      dragEnd(e);
    });
    
    lightbox.addEventListener('mousedown', dragStart);
    lightbox.addEventListener('touchstart', dragStart, { passive: false });
    
    function dragStart(e) {
      if (interactionLock) return;
      if (e.type === 'mousedown') e.preventDefault();
      
      if (e.type === 'touchstart' && e.touches.length >= 2) {
        isZooming = true; hasMoved = true; lastTouchWasZoom = true;
        lbInitDist = Math.hypot(e.touches[0].pageX - e.touches[1].pageX, e.touches[0].pageY - e.touches[1].pageY);
        lbInitScale = lbScale; lbImg.style.transition = 'none';
        return;
      }
      
      isDragging = true; hasMoved = false; isZooming = false;
      const clientX = e.type === 'touchstart' ? e.touches[0].clientX : e.clientX;
      const clientY = e.type === 'touchstart' ? e.touches[0].clientY : e.clientY;
      startX = clientX; startY = clientY; initialX = currentX; initialY = currentY;
      lbImg.style.transition = 'none';
    }
    
    lightbox.addEventListener('mousemove', dragMove);
    lightbox.addEventListener('touchmove', dragMove, { passive: false });
    
    function dragMove(e) {
      e.preventDefault();
      if (interactionLock) return;
      
      if (e.type === 'touchmove' && e.touches.length >= 2) {
        hasMoved = true; isZooming = true; lastTouchWasZoom = true;
        const dist = Math.hypot(e.touches[0].pageX - e.touches[1].pageX, e.touches[0].pageY - e.touches[1].pageY);
        lbScale = Math.max(0.3, Math.min(lbInitScale * (dist / lbInitDist), 5));
        lbImg.style.transition = 'none';
        updateTransform();
        return;
      }
      
      if (!isDragging) return;
      const clientX = e.type === 'touchmove' ? e.touches[0].clientX : e.clientX;
      const clientY = e.type === 'touchmove' ? e.touches[0].clientY : e.clientY;
      const dx = clientX - startX; const dy = clientY - startY;
      if (Math.abs(dx) > 3 || Math.abs(dy) > 3) hasMoved = true;
      currentX = initialX + dx; currentY = initialY + dy;
      updateTransform();
    }
    
    lightbox.addEventListener('touchend', dragEnd);
    
    function dragEnd(e) {
      if (lightbox.style.display !== 'flex') return;
      if (isZooming || lastTouchWasZoom) {
        interactionLock = true; setTimeout(() => { interactionLock = false; }, 250);
      }
      isDragging = false; isZooming = false;
      if (e.type === 'touchend' && e.touches.length > 0) return;
      
      if (lbScale < 0.6) {
        interactionLock = true; lbScale = 1; currentX = 0; currentY = 0;
        setTransition(true); updateTransform();
        setTimeout(() => { interactionLock = false; }, 1500); 
      } else {
        setTransition(false);
      }
      setTimeout(() => { lastTouchWasZoom = false; }, 300);
    }
    
    lightbox.addEventListener('click', (e) => {
      if (!hasMoved && !lastTouchWasZoom) closeLightbox();
      hasMoved = false;
    });
    
    lightbox.addEventListener('wheel', (e) => {
      e.preventDefault();
      if (interactionLock) return;
      
      lbImg.style.transition = 'none';
      if (lbScale < 1) lbScale += e.deltaY * -0.001; 
      else lbScale += e.deltaY * -0.003;
      
      lbScale = Math.max(0.3, Math.min(lbScale, 5));
      if (lbScale < 1) { currentX *= 0.85; currentY *= 0.85; }
      updateTransform();
      
      clearTimeout(window.wheelTimeout);
      window.wheelTimeout = setTimeout(() => {
        if (lbScale < 0.6) {
          interactionLock = true; lbScale = 1; currentX = 0; currentY = 0;
          setTransition(true); updateTransform();
          setTimeout(() => { interactionLock = false; }, 1500); 
        }
      }, 150);
    }, { passive: false });
    
    // ─────────────────────────────────────────
    // 复制微信号 (统一字母大写)
    // 说明：以前用 alert() 弹"已复制"，点确定后焦点会回到临时文本框，
    //      手机上键盘会闪一下再收起。现在改成本站的轻提示，且兜底复制
    //      用 readonly + inputmode=none 的文本框，只 select 不聚焦，不弹键盘。
    // ─────────────────────────────────────────
    let toastTimer = null;
    function toast(msg) {
      let el = document.getElementById('toast');
      if (!el) {
        el = document.createElement('div');
        el.id = 'toast'; el.className = 'toast';
        document.body.appendChild(el);
      }
      el.textContent = msg;
      void el.offsetWidth;               // 强制回流，连点两次也能重新触发过渡
      el.classList.add('on');
      clearTimeout(toastTimer);
      toastTimer = setTimeout(function () { el.classList.remove('on'); }, 1800);
    }

    function copyWechat() {
      const wechatId = "CJQ678";
      if (navigator.clipboard && window.isSecureContext) {
        navigator.clipboard.writeText(wechatId)
          .then(function () { toast('微信号 CJQ678 已复制'); })
          .catch(function () { fallbackCopyTextToClipboard(wechatId); });
      } else {
        fallbackCopyTextToClipboard(wechatId);
      }
    }

    function fallbackCopyTextToClipboard(text) {
      const textArea = document.createElement("textarea");
      textArea.value = text;
      textArea.setAttribute("readonly", "");      // 只读 → 手机不呼出键盘
      textArea.setAttribute("inputmode", "none"); // 双保险
      textArea.setAttribute("tabindex", "-1");
      textArea.setAttribute("aria-hidden", "true");
      textArea.style.cssText = "position:fixed;top:0;left:0;width:1px;height:1px;padding:0;border:0;opacity:0;pointer-events:none";
      document.body.appendChild(textArea);
      let ok = false;
      try {
        textArea.select();
        textArea.setSelectionRange(0, text.length);
        ok = document.execCommand('copy');
      } catch (err) { ok = false; }
      textArea.blur();
      document.body.removeChild(textArea);
      toast(ok ? '微信号 CJQ678 已复制' : '请手动输入：CJQ678');
    }
    
    initGallery();

    // 窑门交互：点门进入分类展厅
    document.getElementById('door-tea').addEventListener('click', function (e) { e.preventDefault(); openCategory('tea'); });
    document.getElementById('door-clay').addEventListener('click', function (e) { e.preventDefault(); openCategory('clay'); });
    document.getElementById('cat-back').addEventListener('click', function () { goHome(); });

    // 开窑仪式：帘幕向两侧拉开，火光与火星随之淡入
    document.addEventListener('DOMContentLoaded', function () { document.body.classList.add('ready'); });

  </script>
</body>
