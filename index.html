<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>荣昌陶艺 · 个人作品展厅</title>
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
  <link rel="preconnect" href="https://api.github.com" crossorigin>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500&family=Noto+Serif+SC:wght@400;600;900&display=swap" rel="stylesheet">
  
  <!-- 拦截脚本：彻底消灭刷新闪现 FOUC -->
  <script>
    if (window.location.hash.substring(1)) {
      document.write('<style id="hide-home-style">.hero, .container, footer { display: none !important; }</style>');
    }
  </script>

  <style>
    :root {
      --bg-color: #121212;
      --card-bg: #1e1e1e;
      --text-main: #f0e6d3;
      --text-light: #888888;
      --text-body: #d6c9b8;
      --accent-color: #d4a373;
      --border-color: #333333;
    }
    
    body, html {
      margin: 0; padding: 0;
      background-color: var(--bg-color);
      color: var(--text-main);
      font-family: 'Noto Sans SC', sans-serif;
      scroll-behavior: smooth;
    }
    
    h1, h2, h3, h4, h5, h6, .serif { font-family: 'Noto Serif SC', serif; font-weight: 600; }
    
    /* ===== Hero ===== */
    .hero { max-width: 1200px; margin: 0 auto; padding: 60px 20px 40px 20px; text-align: center; animation: fadeIn 1s ease-out; }
    .hero-text h1 { font-size: 2.5rem; letter-spacing: 0.1em; margin-bottom: 15px; }
    .hero-text p { font-size: 1.1rem; color: var(--text-light); max-width: 600px; margin: 0 auto 40px auto; line-height: 1.8; }
    .hero-image img { width: 100%; height: auto; max-height: 75vh; object-fit: contain; border-radius: 4px; }
    
    /* ===== Gallery ===== */
    .container { max-width: 1200px; margin: 0 auto; padding: 40px 20px; }
    .gallery-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 25px; opacity: 0; transition: opacity 1s ease-in; }
    @media (max-width: 768px) {
      .gallery-grid { grid-template-columns: repeat(2, 1fr); gap: 15px; }
      .hero-text h1 { font-size: 2rem; }
    }
    
    .product-card { cursor: pointer; transition: transform 0.4s ease, box-shadow 0.4s ease; background: var(--card-bg); padding: 8px; border-radius: 4px; box-shadow: 0 4px 15px rgba(0,0,0,0.5); }
    .product-card:hover { transform: translateY(-5px); box-shadow: 0 8px 25px rgba(0,0,0,0.8); }
    .product-card img { width: 100%; height: auto; aspect-ratio: 1 / 1; object-fit: cover; border-radius: 2px; display: block; }
    .product-info { padding: 12px 5px 5px 5px; text-align: center; }
    .product-info h3 { margin: 0; font-size: 1.05rem; color: var(--text-main); }
    
    /* ===== Modal ===== */
    .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: var(--bg-color); z-index: 1000; overflow-y: auto; animation: fadeIn 0.3s; -webkit-overflow-scrolling: touch; }
    .close-btn { position: fixed; top: 20px; left: 20px; width: 36px; height: 36px; border-radius: 50%; background: rgba(0,0,0,0.4); backdrop-filter: blur(5px); -webkit-backdrop-filter: blur(5px); display: flex; justify-content: center; align-items: center; cursor: pointer; color: #fff; z-index: 1001; transition: background 0.3s, transform 0.2s; }
    .close-btn:hover { background: rgba(0,0,0,0.8); transform: scale(1.05); }
    .close-btn svg { width: 20px; height: 20px; stroke: currentColor; stroke-width: 2; fill: none; }
    .modal-content-dynamic { width: 100%; animation: fadeIn 0.4s; }
    
    /* ===== 详情页 Hero ===== */
    .detail-hero-wrapper { 
      position: relative; width: 100%; height: auto; background: #000; 
      font-size: 0; line-height: 0; display: block;
    }
    .detail-hero-wrapper img { 
      width: 100%; height: auto; display: block; 
      opacity: 0.95; cursor: zoom-in; 
    }
    
    /* ===== 独立透明 PNG 印章 ===== */
    img.sold-stamp-hero {
      position: absolute; top: 30px; right: 30px;
      /* 电脑端大小 50px */
      width: 50px; height: auto; 
      transform: rotate(-6deg);
      /* 恢复100%原图颜色 */
      opacity: 1; pointer-events: none;
      filter: drop-shadow(0 2px 5px rgba(0,0,0,0.3));
      z-index: 5;
    }
    @media (max-width: 768px) {
      img.sold-stamp-hero { 
        /* 手机端大小 30px */
        width: 30px; 
        top: 20px; right: 20px; 
      }
    }
    
    /* ===== 详情文字卡片 ===== */
    .detail-text-card { 
      position: relative; max-width: 800px; 
      margin: -100px auto 40px auto; 
      background: rgba(30, 30, 30, 0.75); 
      backdrop-filter: blur(15px);
      -webkit-backdrop-filter: blur(15px);
      padding: 40px; border-radius: 8px; 
      box-shadow: 0 10px 40px rgba(0,0,0,0.8); z-index: 10; 
      border: 1px solid rgba(255, 255, 255, 0.05);
    }
    @media (max-width: 768px) { 
      .detail-text-card { margin: -60px 15px 30px 15px; padding: 25px; } 
    }
    .detail-text-card h2.main-title { margin-top: 0; font-size: 1.8rem; border-bottom: 1px solid var(--border-color); padding-bottom: 15px; color: var(--text-main); }
    
    /* ===== Markdown 顶级中文排印标准 ===== */
    .md-body { color: var(--text-body); font-size: 1.05rem; line-height: 2.1; font-family: 'Noto Serif SC', serif; font-weight: 400; margin-bottom: 30px; }
    .md-body p { margin: 0 0 1.5em 0; white-space: normal; text-align: justify; text-justify: inter-character; word-break: normal; line-break: strict; }
    
    .md-body h1, .md-body h2, .md-body h3, .md-body h4, .md-body h5, .md-body h6 { 
      font-family: 'Noto Serif SC', serif; color: var(--text-main); margin: 1.5em 0 0.8em 0; line-height: 1.4; 
    }
    .md-body h1 { font-size: 2.2em; text-align: center; }
    .md-body h2 { font-size: 1.6em; border-left: 5px solid var(--accent-color); padding-left: 15px; }
    .md-body h3 { font-size: 1.3em; color: var(--text-main); }
    .md-body h4 { font-size: 1.15em; }
    .md-body h5 { font-size: 1.05em; }
    .md-body h6 { font-size: 1em; color: var(--text-light); }
    
    .md-body strong { color: var(--accent-color); font-weight: 900; }
    .md-body em { font-style: italic; opacity: 0.8; }
    .md-body ul, .md-body ol { padding-left: 1.5em; margin: 1em 0; background: rgba(255,255,255,0.02); padding: 15px 15px 15px 35px; border-radius: 4px; text-align: justify; text-justify: inter-character; }
    .md-body li { margin-bottom: 0.5em; }
    .md-body li::marker { color: var(--accent-color); }
    .md-body hr { border: none; border-top: 1px dashed #444; margin: 2.5em auto; width: 50%; }
    .md-body blockquote { border-left: 3px solid var(--accent-color); margin: 1.5em 0; padding: 15px 20px; background: rgba(212, 163, 115, 0.08); border-radius: 0 4px 4px 0; color: var(--text-main); font-style: italic; text-align: justify; text-justify: inter-character; }
    
    .txt-body { color: var(--text-body); line-height: 2.1; white-space: pre-line; font-size: 1.05rem; text-align: justify; text-justify: inter-character; line-break: strict; font-family: 'Noto Serif SC', serif; }
    
    /* ===== 按钮区域逻辑优化 ===== */
    .btn-row { display: flex; align-items: center; justify-content: flex-start; margin-top: 30px; flex-wrap: nowrap; gap: 15px; }
    
    /* 正常按钮：强烈的销售结缘属性 */
    .btn-wechat { 
      padding: 12px 25px; background-color: var(--accent-color); color: #121212; 
      font-weight: 600; border-radius: 2px; cursor: pointer; transition: all 0.3s ease; white-space: nowrap; 
    }
    .btn-wechat:hover { background-color: #e5b686; }
    
    /* 已结缘按钮：缩小体积 + 中式双线典雅边框 */
    .btn-sold-status {
      padding: 6px 18px; /* 内边距缩小，让整个框更精巧 */
      font-size: 0.95rem; /* 字号略微减小 */
      background-color: transparent; 
      color: var(--accent-color);
      /* 核心设计：双线框打断单调直线，配合圆角 */
      border: 3px double var(--accent-color); 
      border-radius: 6px; 
      opacity: 0.9;
      letter-spacing: 1px; /* 字距稍微拉开，增加呼吸感 */
    }
    .btn-sold-status:hover {
      background-color: rgba(212, 163, 115, 0.1); opacity: 1;
    }
    
    @media (max-width: 400px) {
      .btn-wechat { padding: 10px 15px; font-size: 0.9rem; }
      /* 手机端进一步缩已结缘小按钮 */
      .btn-sold-status { padding: 5px 14px; font-size: 0.85rem; }
    }
    
    /* ===== 详情图列表与底部标识 ===== */
    .detail-images-list { max-width: 800px; margin: 0 auto; padding: 0 20px 0 20px; display: block; }
    .detail-images-list img { width: 100%; height: auto; border-radius: 4px; cursor: zoom-in; box-shadow: 0 4px 15px rgba(0,0,0,0.5); margin-bottom: 30px; display: block; }
    
    .end-of-content {
      text-align: center; padding: 10px 0 60px 0; color: var(--text-light);
      font-family: 'Noto Serif SC', serif; font-size: 0.9rem; letter-spacing: 3px;
      display: flex; align-items: center; justify-content: center; opacity: 0.5;
    }
    .end-of-content::before, .end-of-content::after {
      content: ""; height: 1px; width: 50px; background: var(--text-light);
      margin: 0 15px; opacity: 0.2;
    }
    
    /* ===== Lightbox ===== */
    .lightbox { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,1); z-index: 2000; justify-content: center; align-items: center; overflow: hidden; }
    .lightbox img { width: auto; height: auto; max-width: 100%; max-height: 100vh; object-fit: contain; user-select: none; -webkit-user-drag: none; pointer-events: none; transform-origin: center center; will-change: transform; }
    
    /* ===== Footer ===== */
    footer { text-align: center; padding: 40px 20px; font-size: 0.85rem; color: var(--text-light); border-top: 1px solid var(--border-color); margin-top: 50px; }
    
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    #loading { text-align: center; padding: 50px; color: var(--text-light); }
  </style>
</head>
<body>
  
  <div class="hero">
    <div class="hero-text">
      <h1>荣昌陶艺</h1>
      <p class="serif">泥火交融，凝结匠心。每一件作品，都是与时间的对话。</p>
    </div>
    <div class="hero-image">
      <img src="hero.jpg" alt="荣昌陶艺" decoding="async" onerror="this.src='https://images.unsplash.com/photo-1610701596007-11502861dcfa?q=80&w=2000&auto=format&fit=crop'; this.onerror=null;">
    </div>
  </div>
  
  <div class="container">
    <div id="loading">正在从云端读取展厅数据，请稍候...</div>
    <div class="gallery-grid" id="gallery"></div>
  </div>
  
  <div id="product-modal" class="modal">
    <div class="close-btn" onclick="closeModal()">
      <svg viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M15 19l-7-7 7-7" /></svg>
    </div>
    <div id="modal-dynamic-box"></div>
  </div>
  
  <div id="lightbox" class="lightbox">
    <img id="lightbox-img" src="" alt="大图">
  </div>
  
  <footer>
    <p>© 2024 cc2026cc All Rights Reserved. 荣昌陶艺个人线上展厅</p>
    <p style="font-size:0.75rem; margin-top:10px; color:#555;">隐私声明：本站仅作陈列展示，不收集任何个人可识别信息。</p>
  </footer>
  
  <script>
    const GITHUB_USERNAME = "cc2026cc";
    const REPO_NAME = "my-gallery";
    const apiBase = `https://api.github.com/repos/${GITHUB_USERNAME}/${REPO_NAME}/contents/products`;
    const rawBase = `https://cdn.jsdelivr.net/gh/${GITHUB_USERNAME}/${REPO_NAME}@main/products`;
    
    const rootRawBase = `https://cdn.jsdelivr.net/gh/${GITHUB_USERNAME}/${REPO_NAME}@main`;
    const stampFilename = 'yinzhang.png';
    const stampCDNUrl = `${rootRawBase}/${stampFilename}`;

    function renderMarkdown(md) {
      const lines = md.split('\n');
      let html = '';
      let inUl = false, inOl = false;
      
      const closeList = () => {
        if (inUl) { html += '</ul>'; inUl = false; }
        if (inOl) { html += '</ol>'; inOl = false; }
      };
      
      const inline = (str) => {
        let s = str;
        s = s.replace(/!\[.*?\]\(.*?\)/g, '');
        s = s.replace(/\[([^\]]+)\]\([^)]+\)/g, '$1');
        s = s.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>');
        s = s.replace(/__(.*?)__/g, '<strong>$1</strong>');
        s = s.replace(/\*(.*?)\*/g, '<em>$1</em>');
        s = s.replace(/_(.*?)_/g, '<em>$1</em>');
        s = s.replace(/~~(.*?)~~/g, '<del>$1</del>');
        return s;
      };
        
      for (let i = 0; i < lines.length; i++) {
        const line = lines[i];
        const trimmed = line.trim();
        
        if (/^(-{3,}|\*{3,}|_{3,})$/.test(trimmed)) {
          closeList(); html += '<hr>'; continue;
        }
        
        const hMatch = trimmed.match(/^(#{1,6})\s*(.+)/);
        if (hMatch) {
          closeList();
          const level = hMatch[1].length;
          html += `<h${level}>${inline(hMatch[2])}</h${level}>`;
          continue;
        }
        
        if (trimmed.startsWith('> ')) {
          closeList();
          html += `<blockquote>${inline(trimmed.slice(2))}</blockquote>`;
          continue;
        }
        
        if (/^[-*+]\s+/.test(trimmed)) {
          if (inOl) { html += '</ol>'; inOl = false; }
          if (!inUl) { html += '<ul>'; inUl = true; }
          html += `<li>${inline(trimmed.replace(/^[-*+]\s+/, ''))}</li>`;
          continue;
        }
        
        if (/^\d+\.\s+/.test(trimmed)) {
          if (inUl) { html += '</ul>'; inUl = false; }
          if (!inOl) { html += '<ol>'; inOl = true; }
          html += `<li>${inline(trimmed.replace(/^\d+\.\s+/, ''))}</li>`;
          continue;
        }
        
        if (trimmed === '') { closeList(); continue; }
        
        closeList();
        html += `<p>${inline(trimmed)}</p>`;
      }
      closeList();
      return html;
    }
    
    async function initGallery() {
      const galleryElement = document.getElementById('gallery');
      const loadingElement = document.getElementById('loading');
      
      try {
        const response = await fetch(apiBase);
        if (!response.ok) throw new Error("无法读取目录");
        const folders = await response.json();
        
        for (let folder of folders) {
          if (folder.type !== 'dir') continue;
          
          const folderName = folder.name;
          const folderRes = await fetch(`${apiBase}/${encodeURIComponent(folderName)}`);
          const files = await folderRes.json();
          
          let images = [];
          let infoUrl = '';
          let infoType = '';
          
          files.forEach(file => {
            const ext = file.name.split('.').pop().toLowerCase();
            if (['jpg', 'jpeg', 'png', 'webp'].includes(ext)) {
              images.push(file.name);
            } else if (ext === 'md' || ext === 'txt') {
              if (ext === 'md' || infoType === '') {
                infoUrl = `${rawBase}/${encodeURIComponent(folderName)}/${encodeURIComponent(file.name)}`;
                infoType = ext;
              }
            }
          });
          
          images.sort();
          const coverImg = images.length > 0 
            ? `${rawBase}/${encodeURIComponent(folderName)}/${encodeURIComponent(images[0])}` 
            : '';
            
          const cardName = folderName.includes('-') 
            ? folderName.split('-').slice(1).join('-') 
            : folderName;
            
          if (coverImg) {
            createCard(folderName, cardName, coverImg, images, infoUrl, infoType);
          }
        }
        loadingElement.style.display = 'none';
        galleryElement.style.opacity = '1';
        
        setTimeout(() => {
          const hash = decodeURIComponent(window.location.hash.substring(1));
          if (hash) {
            const cards = document.querySelectorAll('.product-card');
            for (let card of cards) {
              if (card.getAttribute('data-folder') === hash) {
                card.click();
                break;
              }
            }
          }
        }, 100);
        
      } catch (error) {
        loadingElement.innerHTML = '⚠ 数据读取失败。';
      }
    }
    
    function createCard(folderName, cardName, coverUrl, allImages, infoUrl, infoType) {
      const gallery = document.getElementById('gallery');
      const card = document.createElement('div');
      card.className = 'product-card';
      card.setAttribute('data-folder', folderName);
      card.innerHTML = `
        <img src="${coverUrl}" alt="${cardName}" loading="lazy" decoding="async">
        <div class="product-info"><h3 class="serif">${cardName}</h3></div>
      `;
      card.onclick = () => openModal(folderName, cardName, allImages, infoUrl, infoType);
      gallery.appendChild(card);
    }
    
    async function openModal(folderName, fallbackName, images, infoUrl, infoType) {
      if (decodeURIComponent(window.location.hash.substring(1)) !== folderName) {
        window.history.pushState(null, '', '#' + encodeURIComponent(folderName));
      }
      
      const modal = document.getElementById('product-modal');
      const dynamicBox = document.getElementById('modal-dynamic-box');
      
      modal.style.display = 'block';
      document.body.style.overflow = 'hidden';
      
      let docTitle = fallbackName;
      let bodyHTML = '';
      let isSold = false;
      
      if (infoUrl) {
        try {
          const res = await fetch(infoUrl);
          const buffer = await res.arrayBuffer();
          const text = new TextDecoder('utf-8').decode(buffer);
          
          isSold = text.includes('已结缘');
          const lines = text.replace(/\r\n/g, '\n').replace(/\r/g, '\n').split('\n');
          const rawTitle = lines[0].replace(/^#+\s*/, '').replace(/[*_~`]/g, '').trim();
          if (rawTitle) docTitle = rawTitle;
          
          const bodyText = lines.slice(1).join('\n').trim();
          
          if (infoType === 'md') {
            bodyHTML = `<div class="md-body">${renderMarkdown(bodyText)}</div>`;
          } else {
            bodyHTML = `<div class="txt-body">${escapeHtml(bodyText)}</div>`;
          }
        } catch (e) {
          bodyHTML = '<div class="txt-body">（详见图片展示）</div>';
        }
      } else {
        bodyHTML = '<div class="txt-body">（详见图片展示）</div>';
      }
      
      const stampHero = isSold ? `<img src="${stampCDNUrl}" onerror="this.onerror=null; this.src='products/yinzhang.png';" class="sold-stamp-hero" alt="已结缘">` : '';
      
      let wechatBtnHTML = '';
      if (isSold) {
        // 微信号改为大写 CJQ678
        wechatBtnHTML = `<div class="btn-wechat btn-sold-status" onclick="copyWechat()">已结缘·交流加微信CJQ678</div>`;
      } else {
        // 微信号改为大写 CJQ678
        wechatBtnHTML = `<div class="btn-wechat" onclick="copyWechat()">结缘咨询 (复制微信号 CJQ678)</div>`;
      }
      
      const firstImgSrc = `${rawBase}/${encodeURIComponent(folderName)}/${encodeURIComponent(images[0])}`;
      let restImgsHTML = '';
      for (let i = 1; i < images.length; i++) {
        const src = `${rawBase}/${encodeURIComponent(folderName)}/${encodeURIComponent(images[i])}`;
        restImgsHTML += `<img src="${src}" loading="lazy" decoding="async" onclick="openLightbox(this.src)">`;
      }
      
      dynamicBox.innerHTML = `
        <div class="modal-content-dynamic">
          <div class="detail-hero-wrapper">
            <img src="${firstImgSrc}" decoding="async" onclick="openLightbox(this.src)">
            ${stampHero}
          </div>
          <div class="detail-text-card">
            <h2 class="serif main-title">${escapeHtml(docTitle)}</h2>
            ${bodyHTML}
            <div class="btn-row">
              ${wechatBtnHTML}
            </div>
          </div>
          <div class="detail-images-list">${restImgsHTML}</div>
          <div class="end-of-content">· 观止 ·</div>
        </div>
      `;
    }
    
    function escapeHtml(str) {
      return str.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
    }
    
    function closeModal() {
      document.getElementById('product-modal').style.display = 'none';
      document.body.style.overflow = 'auto';
      
      const hideHomeStyle = document.getElementById('hide-home-style');
      if (hideHomeStyle) hideHomeStyle.remove();
      
      if (window.location.hash) {
        window.history.pushState(null, '', window.location.pathname + window.location.search);
      }
    }
    
    window.addEventListener('popstate', () => {
      const hash = decodeURIComponent(window.location.hash.substring(1));
      if (hash) {
        const cards = document.querySelectorAll('.product-card');
        for (let card of cards) {
          if (card.getAttribute('data-folder') === hash) {
            card.click();
            break;
          }
        }
      } else {
        document.getElementById('product-modal').style.display = 'none';
        document.body.style.overflow = 'auto';
        const hideHomeStyle = document.getElementById('hide-home-style');
        if (hideHomeStyle) hideHomeStyle.remove();
      }
    });
    
    // ─────────────────────────────────────────
    // 终极灯箱缩放引擎
    // ─────────────────────────────────────────
    const lightbox = document.getElementById('lightbox');
    const lbImg = document.getElementById('lightbox-img');
    
    let lbScale = 1, currentX = 0, currentY = 0;
    let isDragging = false, hasMoved = false, isZooming = false;
    let startX = 0, startY = 0, initialX = 0, initialY = 0;
    let lbInitDist = 0, lbInitScale = 1;
    let interactionLock = false;
    let lastTouchWasZoom = false;
    
    function setTransition(slow) {
      if (slow) {
        lbImg.style.transition = 'transform 1.5s cubic-bezier(0.1, 0.8, 0.2, 1)';
      } else {
        lbImg.style.transition = 'transform 0.2s cubic-bezier(0.25, 0.46, 0.45, 0.94)';
      }
    }
    
    function updateTransform() {
      lbImg.style.transform = `translate(${currentX}px, ${currentY}px) scale(${lbScale})`;
    }
    
    function openLightbox(src) {
      lbImg.src = src;
      lightbox.style.display = 'flex';
      lbScale = 1; currentX = 0; currentY = 0;
      hasMoved = false; isZooming = false;
      interactionLock = false; lastTouchWasZoom = false;
      lbImg.style.transition = 'none';
      updateTransform();
      requestAnimationFrame(() => { setTransition(false); });
    }
    
    function closeLightbox() {
      lightbox.style.display = 'none';
    }
    
    document.addEventListener('mouseup', (e) => {
      if (lightbox.style.display !== 'flex') return;
      dragEnd(e);
    });
    
    lightbox.addEventListener('mousedown', dragStart);
    lightbox.addEventListener('touchstart', dragStart, { passive: false });
    
    function dragStart(e) {
      if (interactionLock) return;
      if (e.type === 'mousedown') e.preventDefault();
      
      if (e.type === 'touchstart' && e.touches.length >= 2) {
        isZooming = true; hasMoved = true; lastTouchWasZoom = true;
        lbInitDist = Math.hypot(e.touches[0].pageX - e.touches[1].pageX, e.touches[0].pageY - e.touches[1].pageY);
        lbInitScale = lbScale; lbImg.style.transition = 'none';
        return;
      }
      
      isDragging = true; hasMoved = false; isZooming = false;
      const clientX = e.type === 'touchstart' ? e.touches[0].clientX : e.clientX;
      const clientY = e.type === 'touchstart' ? e.touches[0].clientY : e.clientY;
      startX = clientX; startY = clientY; initialX = currentX; initialY = currentY;
      lbImg.style.transition = 'none';
    }
    
    lightbox.addEventListener('mousemove', dragMove);
    lightbox.addEventListener('touchmove', dragMove, { passive: false });
    
    function dragMove(e) {
      e.preventDefault();
      if (interactionLock) return;
      
      if (e.type === 'touchmove' && e.touches.length >= 2) {
        hasMoved = true; isZooming = true; lastTouchWasZoom = true;
        const dist = Math.hypot(e.touches[0].pageX - e.touches[1].pageX, e.touches[0].pageY - e.touches[1].pageY);
        lbScale = Math.max(0.3, Math.min(lbInitScale * (dist / lbInitDist), 5));
        lbImg.style.transition = 'none';
        updateTransform();
        return;
      }
      
      if (!isDragging) return;
      const clientX = e.type === 'touchmove' ? e.touches[0].clientX : e.clientX;
      const clientY = e.type === 'touchmove' ? e.touches[0].clientY : e.clientY;
      const dx = clientX - startX; const dy = clientY - startY;
      if (Math.abs(dx) > 3 || Math.abs(dy) > 3) hasMoved = true;
      currentX = initialX + dx; currentY = initialY + dy;
      updateTransform();
    }
    
    lightbox.addEventListener('touchend', dragEnd);
    
    function dragEnd(e) {
      if (lightbox.style.display !== 'flex') return;
      if (isZooming || lastTouchWasZoom) {
        interactionLock = true; setTimeout(() => { interactionLock = false; }, 250);
      }
      isDragging = false; isZooming = false;
      if (e.type === 'touchend' && e.touches.length > 0) return;
      
      if (lbScale < 0.6) {
        interactionLock = true; lbScale = 1; currentX = 0; currentY = 0;
        setTransition(true); updateTransform();
        setTimeout(() => { interactionLock = false; }, 1500); 
      } else {
        setTransition(false);
      }
      setTimeout(() => { lastTouchWasZoom = false; }, 300);
    }
    
    lightbox.addEventListener('click', (e) => {
      if (!hasMoved && !lastTouchWasZoom) closeLightbox();
      hasMoved = false;
    });
    
    lightbox.addEventListener('wheel', (e) => {
      e.preventDefault();
      if (interactionLock) return;
      
      lbImg.style.transition = 'none';
      if (lbScale < 1) lbScale += e.deltaY * -0.001; 
      else lbScale += e.deltaY * -0.003;
      
      lbScale = Math.max(0.3, Math.min(lbScale, 5));
      if (lbScale < 1) { currentX *= 0.85; currentY *= 0.85; }
      updateTransform();
      
      clearTimeout(window.wheelTimeout);
      window.wheelTimeout = setTimeout(() => {
        if (lbScale < 0.6) {
          interactionLock = true; lbScale = 1; currentX = 0; currentY = 0;
          setTransition(true); updateTransform();
          setTimeout(() => { interactionLock = false; }, 1500); 
        }
      }, 150);
    }, { passive: false });
    
    // ─────────────────────────────────────────
    // 复制微信号 (统一字母大写)
    // ─────────────────────────────────────────
    function copyWechat() {
      const wechatId = "CJQ678";
      if (navigator.clipboard && window.isSecureContext) {
        navigator.clipboard.writeText(wechatId)
          .then(() => { alert("微信号 CJQ678 已复制！"); })
          .catch(() => { fallbackCopyTextToClipboard(wechatId); });
      } else {
        fallbackCopyTextToClipboard(wechatId);
      }
    }
    
    function fallbackCopyTextToClipboard(text) {
      const textArea = document.createElement("textarea");
      textArea.value = text; textArea.style.position = "fixed";
      document.body.appendChild(textArea); textArea.focus(); textArea.select();
      try { document.execCommand('copy'); alert("微信号 CJQ678 已复制！"); } 
      catch (err) { alert("请手动输入：CJQ678"); }
      document.body.removeChild(textArea);
    }
    
    initGallery();
  </script>
