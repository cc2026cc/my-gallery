<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>荣昌陶 · 茶器 / 花器</title>
  <link rel="preconnect" href="https://api.github.com" crossorigin>
  <link rel="preconnect" href="https://raw.githubusercontent.com" crossorigin>
  
  <script>
    if (window.location.hash.substring(1)) {
      document.write('<style id="hide-home-style">#home{display:none!important}</style>');
    }
  </script>
  <noscript><style>.curtain,.glow,.embers{display:none}</style></noscript>

  <style>
    :root {
      --bg-color: #121212;
      --card-bg: #1e1e1e;
      --text-main: #f0e6d3;
      --text-light: #888888;
      --text-body: #d6c9b8;
      --accent-color: #d4a373;
      --border-color: #333333;
      --gold: #d8a85e;
      --gold-l: #eec98a;
      --ink: #f2e8d5;
      --serif: "Noto Serif SC","Songti SC","STSong",serif;
      --sans: -apple-system,BlinkMacSystemFont,"PingFang SC","MiSans","Noto Sans SC","Source Han Sans SC",sans-serif;
    }
    
    /* 全局盒模型重置：默认 content-box 会让 "width:100% + 内边距" 的元素比父容器
       宽出一截（窑门文字被裁的根因），border-box 让宽度含内边距，符合直觉 */
    *, *::before, *::after { box-sizing: border-box; }

    body, html {
      margin: 0; padding: 0;
      background-color: #0a0908;
      color: var(--text-main);
      font-family: var(--sans);
      scroll-behavior: smooth;
    }
    
    h1, h2, h3, h4, h5, h6, .serif { font-family: var(--serif); font-weight: 600; }
    
    /* ===== 窑门双开 · 首页 ===== */
    #home { position: relative; }
    .stage { position: fixed; inset: 0; display: flex; flex-direction: column; --px: 0; --py: 0; }
    .door { position: relative; flex: 1; display: flex; flex-direction: column; justify-content: flex-end; overflow: hidden; cursor: pointer; transition: flex-grow .45s cubic-bezier(.22,.8,.24,1) .08s; text-decoration: none; color: inherit; }
    .door-tea { flex: 1.35; }
    .door-clay { flex: 1; background: #1a0f08; align-items: flex-end; }
    .door-img { position: absolute; inset: -4%; width: 108%; height: 108%; object-fit: cover; transform: translate3d(calc(var(--px) * -12px), calc(var(--py) * -12px), 0) scale(1.02); transition: transform .35s ease-out; will-change: transform; }
    .door:hover .door-img { transform: translate3d(calc(var(--px) * -12px), calc(var(--py) * -12px), 0) scale(1.02); }
    .shade { position: absolute; inset: 0; }
    .door-tea .shade { background: linear-gradient(180deg, rgba(14,10,6,.58), rgba(14,10,6,.06) 42%, rgba(14,10,6,.9)); }
    .door-clay .shade { background: linear-gradient(180deg, rgba(30,14,5,.82), rgba(30,14,5,.28) 42%, rgba(20,9,3,.92)); }
    .zone-body { position: relative; padding: 0 28px 13vh; max-width: 680px; width: 100%; }
    .door-clay .zone-body { margin-left: auto; text-align: right; display: flex; flex-direction: column; align-items: flex-end; }
    .door h1 { font-size: clamp(40px, 5.6vw, 88px); font-weight: 600; letter-spacing: .08em; font-family: var(--serif); line-height: 1.15; margin: 0; }
    /* 两门标题都是 4 个字、对称同档；粗陶门仅 42.6% 宽，封顶 58px 防右缘被裁 */
    .door-clay h1 { font-size: clamp(34px, 4vw, 58px); }
    .meta { margin-top: 12px; font-size: clamp(12px, 1.05vw, 14px); letter-spacing: .08em; color: rgba(242,232,213,.72); min-height: 1.4em; }
    .go { display: inline-flex; align-items: center; gap: 10px; margin-top: 22px; padding: 11px 24px; border: 1px solid rgba(216,168,94,.5); border-radius: 999px; font-size: 13px; letter-spacing: .24em; color: var(--gold-l); transition: background .3s, color .3s, border-color .3s; }
    .go svg { width: 12px; height: 12px; }
    .door:hover .go { background: var(--gold); border-color: var(--gold); color: #1a1409; }
    .seam { position: relative; flex: 0 0 1px; align-self: stretch; background: linear-gradient(90deg, transparent, rgba(216,168,94,.5) 12%, rgba(216,168,94,.5) 88%, transparent); z-index: 5; }
    .top { position: fixed; top: 0; left: 0; right: 0; display: flex; justify-content: space-between; align-items: center; gap: 16px; padding: calc(20px + env(safe-area-inset-top)) 32px 8px; z-index: 8; pointer-events: none; }
    .top b { font-size: 19px; font-weight: 600; letter-spacing: .5em; font-family: var(--serif); }
    .top .slogan { display: none; font-size: 11px; letter-spacing: .28em; color: rgba(242,232,213,.55); font-family: var(--serif); }
    .top span { font-size: 12px; letter-spacing: .16em; color: var(--gold); }
    .curtain { position: fixed; left: 0; right: 0; height: 50.8%; background: #100d0a; z-index: 20; transition: transform 1.15s cubic-bezier(.7,0,.2,1); pointer-events: auto; }
    .curtain-l { top: 0; border-bottom: 1px solid rgba(216,168,94,.25); }
    .curtain-r { bottom: 0; border-top: 1px solid rgba(216,168,94,.25); }
    body.ready .curtain-l { transform: translateY(-101%); }
    body.ready .curtain-r { transform: translateY(101%); }
    body.ready .curtain { pointer-events: none; }
    .glow { position: fixed; left: 50%; top: 50%; transform: translate(-50%,-50%); width: 70vmax; height: 70vmax; background: radial-gradient(circle, rgba(239,159,39,.26), rgba(216,90,48,.1) 42%, transparent 70%); z-index: 19; pointer-events: none; animation: fadeGlow 5.4s ease .3s forwards; }
    @keyframes fadeGlow { to { opacity: 0; } }
    .embers { position: fixed; inset: 0; z-index: 21; pointer-events: none; overflow: hidden; }
    .embers i { position: absolute; bottom: -8px; left: var(--l); width: 3px; height: 3px; border-radius: 50%; background: var(--gold-l); opacity: 0; animation: rise 5.1s ease-out var(--d) forwards; }
    @keyframes rise { 12% { opacity: .95; } 100% { transform: translateY(-52vh) scale(.3); opacity: 0; } }
    .door:focus-visible { outline: 2px solid var(--gold); outline-offset: -4px; }
    @media (max-width: 899px) {
      .door-clay { justify-content: flex-start; }
      .door-clay .zone-body { padding: 36px 28px 0; }
      /* 手机窄屏：两门标题分别限档，4 个字在任何窄屏都不会被裁 */
      .door-tea h1 { font-size: clamp(34px, 9vw, 46px); }
      .door-clay h1 { font-size: clamp(30px, 8vw, 40px); }
    }
    @media (hover: hover) {
      /* 互斥 + 80ms 过渡死区：鼠标压在 1px 窑缝上时两扇门可能同时 :hover，
         flex 值反复横跳就是"中线抽搐"的根因；:not(:has()) 保证只有一个门响应 */
      .stage:has(.door-tea:hover):not(:has(.door-clay:hover)) .door-tea { flex: 1.55; }
      .stage:has(.door-tea:hover):not(:has(.door-clay:hover)) .door-clay { flex: .94; }
      .stage:has(.door-clay:hover):not(:has(.door-tea:hover)) .door-clay { flex: 1.08; }
      .stage:has(.door-clay:hover):not(:has(.door-tea:hover)) .door-tea { flex: 1.27; }
    }
    @media (min-width: 900px) {
      .stage { flex-direction: row; }
      .seam { background: linear-gradient(180deg, transparent, rgba(216,168,94,.5) 12%, rgba(216,168,94,.5) 88%, transparent); }
      .zone-body { padding: 0 6vw 15vh; }
      .top .slogan { display: block; }
    }
    @media (prefers-reduced-motion: reduce) {
      .curtain, .glow, .embers { display: none; }
      .door, .door-img, .go { transition: none; }
    }

    /* ===== 展厅内景（分类视图） ===== */
    #cat-view { display: none; }
    #cat-view.on { display: block; }
    .cat-bar { display: flex; align-items: center; gap: 18px; margin-bottom: 30px; flex-wrap: wrap; }
    .cat-back { background: none; border: 1px solid rgba(216,168,94,.45); color: var(--gold-l); padding: 8px 18px; border-radius: 999px; font-size: 13px; letter-spacing: .18em; cursor: pointer; font-family: var(--sans); transition: background .25s, color .25s; }
    .cat-back:hover { background: var(--gold); color: #1a1409; border-color: var(--gold); }
    .cat-title { display: flex; align-items: baseline; gap: 14px; flex-wrap: wrap; }
    .cat-title h2 { margin: 0; font-size: 1.6rem; letter-spacing: .08em; }
    .cat-count { font-size: 12px; letter-spacing: .2em; color: var(--text-light); }
    
    /* ===== Gallery ===== */
    .container { max-width: 1200px; margin: 0 auto; padding: 40px 20px; }
    .gallery-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 25px; opacity: 0; transition: opacity 1s ease-in; }
    @media (max-width: 768px) {
      .gallery-grid { grid-template-columns: repeat(2, 1fr); gap: 15px; }
    }
    
    .product-card { cursor: pointer; transition: transform 0.4s ease, box-shadow 0.4s ease; background: var(--card-bg); padding: 8px; border-radius: 4px; box-shadow: 0 4px 15px rgba(0,0,0,0.5); }
    .product-card:hover { transform: translateY(-5px); box-shadow: 0 8px 25px rgba(0,0,0,0.8); }
    .product-card img { width: 100%; height: auto; aspect-ratio: 1 / 1; object-fit: cover; border-radius: 2px; display: block; }
    .product-info { padding: 12px 5px 5px 5px; text-align: center; }
    .product-info h3 { margin: 0; font-size: 1.05rem; color: var(--text-main); }
    
    /* ===== Modal ===== */
    .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: var(--bg-color); z-index: 1000; overflow-y: auto; animation: fadeIn 0.3s; -webkit-overflow-scrolling: touch; }
    .close-btn { position: fixed; top: 20px; left: 20px; width: 36px; height: 36px; border-radius: 50%; background: rgba(0,0,0,0.4); backdrop-filter: blur(5px); -webkit-backdrop-filter: blur(5px); display: flex; justify-content: center; align-items: center; cursor: pointer; color: #fff; z-index: 1001; transition: background 0.3s, transform 0.2s; }
    .close-btn:hover { background: rgba(0,0,0,0.8); transform: scale(1.05); }
    .close-btn svg { width: 20px; height: 20px; stroke: currentColor; stroke-width: 2; fill: none; }
    .modal-content-dynamic { width: 100%; animation: fadeIn 0.4s; }
    
    /* ===== 详情页 Hero ===== */
    .detail-hero-wrapper { 
      position: relative; width: 100%; height: auto; background: #000; 
      font-size: 0; line-height: 0; display: block;
    }
    .detail-hero-wrapper img { 
      width: 100%; height: auto; display: block; 
      opacity: 0.95; cursor: zoom-in; 
    }
    
    /* ===== 独立透明 PNG 印章 ===== */
    img.sold-stamp-hero {
      position: absolute; top: 30px; right: 30px;
      /* 电脑端大小 50px */
      width: 50px; height: auto; 
      transform: rotate(-6deg);
      /* 恢复100%原图颜色 */
      opacity: 1; pointer-events: none;
      filter: drop-shadow(0 2px 5px rgba(0,0,0,0.3));
      z-index: 5;
    }
    @media (max-width: 768px) {
      img.sold-stamp-hero { 
        /* 手机端大小 30px */
        width: 30px; 
        top: 20px; right: 20px; 
      }
    }
    
    /* ===== 详情文字卡片 ===== */
    .detail-text-card { 
      position: relative; max-width: 800px; 
      margin: -100px auto 40px auto; 
      background: rgba(30, 30, 30, 0.75); 
      backdrop-filter: blur(15px);
      -webkit-backdrop-filter: blur(15px);
      padding: 40px; border-radius: 8px; 
      box-shadow: 0 10px 40px rgba(0,0,0,0.8); z-index: 10; 
      border: 1px solid rgba(255, 255, 255, 0.05);
    }
    @media (max-width: 768px) { 
      .detail-text-card { margin: -60px 15px 30px 15px; padding: 25px; } 
    }
    .detail-text-card h2.main-title { margin-top: 0; font-size: 1.8rem; border-bottom: 1px solid var(--border-color); padding-bottom: 15px; color: var(--text-main); }
    
    /* ===== Markdown 顶级中文排印标准 ===== */
    .md-body { color: var(--text-body); font-size: 1.05rem; line-height: 2.1; font-family: var(--serif); font-weight: 400; margin-bottom: 30px; }
    .md-body p { margin: 0 0 1.5em 0; white-space: normal; text-align: justify; text-justify: inter-character; word-break: normal; line-break: strict; }
    
    .md-body h1, .md-body h2, .md-body h3, .md-body h4, .md-body h5, .md-body h6 { 
      font-family: 'Noto Serif SC', serif; color: var(--text-main); margin: 1.5em 0 0.8em 0; line-height: 1.4; 
    }
    .md-body h1 { font-size: 2.2em; text-align: center; }
    .md-body h2 { font-size: 1.6em; border-left: 5px solid var(--accent-color); padding-left: 15px; }
    .md-body h3 { font-size: 1.3em; color: var(--text-main); }
    .md-body h4 { font-size: 1.15em; }
    .md-body h5 { font-size: 1.05em; }
    .md-body h6 { font-size: 1em; color: var(--text-light); }
    
    .md-body strong { color: var(--accent-color); font-weight: 900; }
    .md-body em { font-style: italic; opacity: 0.8; }
    .md-body ul, .md-body ol { padding-left: 1.5em; margin: 1em 0; background: rgba(255,255,255,0.02); padding: 15px 15px 15px 35px; border-radius: 4px; text-align: justify; text-justify: inter-character; }
    .md-body li { margin-bottom: 0.5em; }
    .md-body li::marker { color: var(--accent-color); }
    .md-body hr { border: none; border-top: 1px dashed #444; margin: 2.5em auto; width: 50%; }
    .md-body blockquote { border-left: 3px solid var(--accent-color); margin: 1.5em 0; padding: 15px 20px; background: rgba(212, 163, 115, 0.08); border-radius: 0 4px 4px 0; color: var(--text-main); font-style: italic; text-align: justify; text-justify: inter-character; }
    
    .txt-body { color: var(--text-body); line-height: 2.1; white-space: pre-line; font-size: 1.05rem; text-align: justify; text-justify: inter-character; line-break: strict; font-family: var(--serif); }
    
    /* ===== 按钮区域逻辑优化 ===== */
    .btn-row { display: flex; align-items: center; justify-content: flex-start; margin-top: 30px; flex-wrap: nowrap; gap: 15px; }
    
    /* 正常按钮：强烈的销售结缘属性 */
    .btn-wechat { 
      padding: 12px 25px; background-color: var(--accent-color); color: #121212; 
      font-weight: 600; border-radius: 2px; cursor: pointer; transition: all 0.3s ease; white-space: nowrap; 
    }
    .btn-wechat:hover { background-color: #e5b686; }

    /* 按钮内的灰色辅助提示：主信息醒目、提示退后 */
    .btn-wechat .hint { color: rgba(18,18,18,.45); font-size: .85em; margin-left: .4em; font-weight: 400; }
    .btn-sold-status .hint { color: rgba(212,163,115,.6); font-size: .85em; margin-left: .4em; font-weight: 400; }
    
    /* 已结缘按钮：缩小体积 + 中式双线典雅边框 */
    .btn-sold-status {
      padding: 6px 18px; 
      font-size: 0.95rem; 
      background-color: transparent; 
      color: var(--accent-color);
      border: 3px double var(--accent-color); 
      border-radius: 6px; 
      opacity: 0.9;
      letter-spacing: 1px;
    }
    .btn-sold-status:hover {
      background-color: rgba(212, 163, 115, 0.1); opacity: 1;
    }
    
    @media (max-width: 400px) {
      .btn-wechat { padding: 10px 15px; font-size: 0.9rem; }
      .btn-sold-status { padding: 5px 14px; font-size: 0.85rem; }
    }
    
    /* ===== 详情图列表与底部标识 ===== */
    .detail-images-list { max-width: 800px; margin: 0 auto; padding: 0 20px 0 20px; display: block; }
    .detail-images-list img { width: 100%; height: auto; border-radius: 4px; cursor: zoom-in; box-shadow: 0 4px 15px rgba(0,0,0,0.5); margin-bottom: 30px; display: block; }
    
    .end-of-content {
      text-align: center; padding: 10px 0 60px 0; color: var(--text-light);
      font-family: 'Noto Serif SC', serif; font-size: 0.9rem; letter-spacing: 3px;
      display: flex; align-items: center; justify-content: center; opacity: 0.5;
    }
    .end-of-content::before, .end-of-content::after {
      content: ""; height: 1px; width: 50px; background: var(--text-light);
      margin: 0 15px; opacity: 0.2;
    }
    
    /* ===== Lightbox ===== */
    .lightbox { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,1); z-index: 2000; justify-content: center; align-items: center; overflow: hidden; }
    .lightbox img { width: auto; height: auto; max-width: 100%; max-height: 100vh; object-fit: contain; user-select: none; -webkit-user-drag: none; pointer-events: none; transform-origin: center center; will-change: transform; }
    
    /* ===== Footer ===== */
    footer { text-align: center; padding: 40px 20px; font-size: 0.85rem; color: var(--text-light); border-top: 1px solid var(--border-color); margin-top: 50px; }
    
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    #loading { text-align: center; padding: 50px; color: var(--text-light); }
  </style>
</head>
<body>
  
  <div id="home">
    <div class="stage">
      <a class="door door-tea" id="door-tea" href="#cat-tea">
        <picture>
          <source media="(min-width:900px)" srcset="assets/tea-hero-pc.jpg">
          <img class="door-img" src="assets/tea-hero.jpg" alt="茶器：茶席上的柴烧壶" fetchpriority="high" decoding="async">
        </picture>
        <div class="shade"></div>
        <div class="zone-body">
          <h1>茶器</h1>
          <p class="meta" id="meta-tea">正从窑火中请出…</p>
          <span class="go">更多 <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"/></svg></span>
        </div>
      </a>
      <div class="seam"></div>
      <a class="door door-clay" id="door-clay" href="#cat-clay">
        <picture>
          <source media="(min-width:900px)" srcset="assets/clay-hero-pc.jpg">
          <img class="door-img" src="assets/clay-hero.jpg" alt="花器：手作国际盆" fetchpriority="high" decoding="async">
        </picture>
        <div class="shade"></div>
        <div class="zone-body">
          <h1>花器</h1>
          <p class="meta" id="meta-clay">正从窑火中请出…</p>
          <span class="go">更多 <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"/></svg></span>
        </div>
      </a>
    </div>
    <header class="top">
      <b>荣昌陶</b>
      <span class="slogan">泥火交融，凝结匠心 · 每一件作品，都是与时间的对话</span>
      <span>微信：CJQ678</span>
    </header>
    <div class="glow"></div>
    <div class="embers">
      <i style="--l:20%;--d:.05s"></i><i style="--l:28%;--d:.18s"></i><i style="--l:36%;--d:.32s"></i><i style="--l:44%;--d:.1s"></i><i style="--l:52%;--d:.26s"></i><i style="--l:60%;--d:.4s"></i><i style="--l:68%;--d:.14s"></i><i style="--l:76%;--d:.34s"></i>
    </div>
    <div class="curtain curtain-l"></div>
    <div class="curtain curtain-r"></div>
  </div>

  <div id="cat-view" class="container">
    <div class="cat-bar">
      <button class="cat-back" id="cat-back" type="button">← 返回首页</button>
      <div class="cat-title">
        <div>
          <h2 id="cat-title" class="serif"></h2>
        </div>
        <span class="cat-count" id="cat-count"></span>
      </div>
    </div>
    <div id="loading">正在从云端读取展厅数据，请稍候...</div>
    <div class="gallery-grid" id="gallery"></div>
    <div class="end-of-content">· 观止 ·</div>
  </div>
  
  <div id="product-modal" class="modal">
    <div class="close-btn" onclick="closeModal()">
      <svg viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M15 19l-7-7 7-7" /></svg>
    </div>
    <div id="modal-dynamic-box"></div>
  </div>
  
  <div id="lightbox" class="lightbox">
    <img id="lightbox-img" src="" alt="大图">
  </div>
  
  <script>
    const GITHUB_USERNAME = "cc2026cc";
    const REPO_NAME = "my-gallery";
    const apiBase = `https://api.github.com/repos/${GITHUB_USERNAME}/${REPO_NAME}/contents/products`;
    const rawBase = `https://raw.githubusercontent.com/${GITHUB_USERNAME}/${REPO_NAME}/main/products`;
    const rootRawBase = `https://raw.githubusercontent.com/${GITHUB_USERNAME}/${REPO_NAME}/main`;
    const stampFilename = 'yinzhang.png';
    const stampCDNUrl = `${rootRawBase}/${stampFilename}`;

    // ─────────────────────────────────────────
    // 双入口分类体系（窑门双开）
    // 分类依据：products 下的两个分类文件夹（细陶茶器 / 粗陶花盆）
    // 加新品只需把资源文件夹放进对应分类目录，无需改任何代码
    // ─────────────────────────────────────────
    const CATS = {
      tea:  { key: 'tea',  folder: '细陶茶器', hash: 'cat-tea',  title: '茶器' },
      clay: { key: 'clay', folder: '粗陶花盆', hash: 'cat-clay', title: '花器' }
    };
    const CAT_ORDER = ['tea', 'clay'];
    const productsByCat = { tea: [], clay: [] };  // 各展厅下的产品数据
    let currentCat = null;                         // 当前所在展厅
    let currentModalFolder = null;                 // 当前展开的产品

    // 产品相对路径（分类文件夹/产品文件夹）→ API 可用的编码路径
    function encRel(rel) {
      return rel.split('/').map(encodeURIComponent).join('/');
    }

    // ─────────────────────────────────────────
    // 核心智能预加载引擎与缓存控制
    // ─────────────────────────────────────────
    // 使用单一会话时间戳，保证页面刷新时获取最新内容，但在同一次访问中各预加载组件能够共享缓存，避免重复请求带宽浪费
    const CACHE_STAMP = new Date().getTime(); 
    const preloadedImagesCache = new Set();
    
    function preloadImage(url) {
      if (!url || preloadedImagesCache.has(url)) return;
      preloadedImagesCache.add(url);
      const img = new Image();
      img.src = url;
    }

    // 交叉观察器：当产品卡片因滑动即将进入视口时，预加载该产品详情页的第一张大图
    const galleryPreloadObserver = new IntersectionObserver((entries, observer) => {
        entries.forEach(entry => {
          if (entry.isIntersecting) {
            const card = entry.target;
            const rel = card.dataset.rel;
            const firstImg = card.dataset.firstImage;
            if (rel && firstImg) {
              const url = `${rawBase}/${encRel(rel)}/${encodeURIComponent(firstImg)}?t=${CACHE_STAMP}`;
            // 延迟 500ms 执行，确保优先加载当前页面的缩略图，不抢占资源
            setTimeout(() => preloadImage(url), 500);
          }
          observer.unobserve(card); // 每张卡片只触发一次预加载
        }
      });
    }, { rootMargin: '300px 0px' }); // 距离视口 300px 时触发

    function renderMarkdown(md) {
      const lines = md.split('\n');
      let html = '';
      let inUl = false, inOl = false;
      
      const closeList = () => {
        if (inUl) { html += '</ul>'; inUl = false; }
        if (inOl) { html += '</ol>'; inOl = false; }
      };
      
      const inline = (str) => {
        let s = str;
        s = s.replace(/!\[.*?\]\(.*?\)/g, '');
        s = s.replace(/\[([^\]]+)\]\([^)]+\)/g, '$1');
        s = s.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>');
        s = s.replace(/__(.*?)__/g, '<strong>$1</strong>');
        s = s.replace(/\*(.*?)\*/g, '<em>$1</em>');
        s = s.replace(/_(.*?)_/g, '<em>$1</em>');
        s = s.replace(/~~(.*?)~~/g, '<del>$1</del>');
        return s;
      };
        
      for (let i = 0; i < lines.length; i++) {
        const line = lines[i];
        const trimmed = line.trim();
        
        if (/^(-{3,}|\*{3,}|_{3,})$/.test(trimmed)) {
          closeList(); html += '<hr>'; continue;
        }
        
        const hMatch = trimmed.match(/^(#{1,6})\s*(.+)/);
        if (hMatch) {
          closeList();
          const level = hMatch[1].length;
          html += `<h${level}>${inline(hMatch[2])}</h${level}>`;
          continue;
        }
        
        if (trimmed.startsWith('> ')) {
          closeList();
          html += `<blockquote>${inline(trimmed.slice(2))}</blockquote>`;
          continue;
        }
        
        if (/^[-*+]\s+/.test(trimmed)) {
          if (inOl) { html += '</ol>'; inOl = false; }
          if (!inUl) { html += '<ul>'; inUl = true; }
          html += `<li>${inline(trimmed.replace(/^[-*+]\s+/, ''))}</li>`;
          continue;
        }
        
        if (/^\d+\.\s+/.test(trimmed)) {
          if (inUl) { html += '</ul>'; inUl = false; }
          if (!inOl) { html += '<ol>'; inOl = true; }
          html += `<li>${inline(trimmed.replace(/^\d+\.\s+/, ''))}</li>`;
          continue;
        }
        
        if (trimmed === '') { closeList(); continue; }
        
        closeList();
        html += `<p>${inline(trimmed)}</p>`;
      }
      closeList();
      return html;
    }
    
    // ─────────────────────────────────────────
    // 窑门两侧的实时款数与在售名录
    // ─────────────────────────────────────────

    function updateDoorMetas() {
      CAT_ORDER.forEach(function (k) {
        const list = productsByCat[k];
        const el = document.getElementById(k === 'tea' ? 'meta-tea' : 'meta-clay');
        if (!el) return;
        if (!list.length) { el.textContent = '暂虚位以待'; return; }
        const names = list.slice(0, 3).map(function (p) { return p.cardName; }).join(' · ');
        el.textContent = names + (list.length > 3 ? ' 等' : '') + ' — ' + list.length + ' 款在售';
      });
    }

    function openCategory(catKey, push) {
      const cat = CATS[catKey];
      if (!cat) return;
      currentCat = catKey;
      document.getElementById('home').style.display = 'none';
      document.getElementById('cat-view').classList.add('on');
      document.getElementById('cat-title').textContent = cat.title;
      document.getElementById('cat-count').textContent = productsByCat[catKey].length ? productsByCat[catKey].length + ' 款' : '';
      const gallery = document.getElementById('gallery');
      gallery.innerHTML = '';
      gallery.style.opacity = '1';
      productsByCat[catKey].forEach(function (p) {
        createCard(p.rel, p.folderName, p.cardName, p.coverImg, p.images, p.infoUrl, p.infoType);
      });
      const target = '#' + cat.hash;
      if (push !== false && window.location.hash !== target) {
        window.history.pushState(null, '', target);
      }
      window.scrollTo(0, 0);
    }

    function goHome() {
      currentCat = null;
      document.getElementById('cat-view').classList.remove('on');
      document.getElementById('home').style.display = '';
      if (window.location.hash) {
        window.history.pushState(null, '', window.location.pathname + window.location.search);
      }
    }

    function routeByHash(onLoad) {
      const hash = decodeURIComponent(window.location.hash.substring(1));
      if (hash !== currentModalFolder) {
        document.getElementById('product-modal').style.display = 'none';
        document.body.style.overflow = 'auto';
      }
      if (!hash) {
        if (!onLoad) goHome();
        return;
      }
      if (hash.indexOf('cat-') === 0) {
        const key = hash.slice(4);
        if (CATS[key]) { openCategory(key, false); return; }
      }
      // 产品深链：先进入所属展厅，再展开详情
      let foundCat = null, foundProduct = null;
      CAT_ORDER.forEach(function (k) {
        productsByCat[k].forEach(function (p) {
          if (p.folderName === hash) { foundCat = k; foundProduct = p; }
        });
      });
      if (foundProduct) {
        openCategory(foundCat, false);
        openModal(foundProduct.rel, foundProduct.folderName, foundProduct.cardName, foundProduct.images, foundProduct.infoUrl, foundProduct.infoType);
      } else if (!onLoad) {
        goHome();
      }
    }

    async function initGallery() {
      const loadingElement = document.getElementById('loading');
      
      try {
        // 第一层：两个分类文件夹；第二层：分类下的每个子文件夹即一件产品
        for (const catKey of CAT_ORDER) {
          const catFolder = CATS[catKey].folder;
          let folders = [];
          try {
            const catRes = await fetch(`${apiBase}/${encodeURIComponent(catFolder)}`);
            if (catRes.ok) folders = await catRes.json();
          } catch (e) { folders = []; }
          
          for (let folder of folders) {
            if (folder.type !== 'dir') continue;
            
            const folderName = folder.name;
            const rel = catFolder + '/' + folderName;
            const folderRes = await fetch(`${apiBase}/${encRel(rel)}`);
            const files = await folderRes.json();
            
            let images = [];
            let infoUrl = '';
            let infoType = '';
            let thumbFilename = ''; // 用于存放特定的缩略图
            
            files.forEach(file => {
              const ext = file.name.split('.').pop().toLowerCase();
              if (['jpg', 'jpeg', 'png', 'webp', 'gif'].includes(ext)) {
                // 精准识别带有 thumb 结尾的文件
                const nameNoExt = file.name.substring(0, file.name.lastIndexOf('.')).toLowerCase();
                if (nameNoExt.endsWith('thumb')) {
                  thumbFilename = file.name; // 提取为缩略图
                } else {
                  images.push(file.name); // 其他图片推入详情页数组（剥离缩略图）
                }
              } else if (ext === 'md' || ext === 'txt') {
                if (ext === 'md' || infoType === '') {
                  infoUrl = `${rawBase}/${encRel(rel)}/${encodeURIComponent(file.name)}`;
                  infoType = ext;
                }
              }
            });
            
            // 图片排序规则（老站规则，按文件名中的数字大小排）：
            // 末尾带 "-序号" 的（-0/-1/-2…-10）按序号数字升序；无序号排其后按文件名；
            // 序号相同按文件名。例：国际盆 6 张 → -0,-1,-2,-3,-4,-5
            images.sort(function (a, b) {
              function tailNo(n) { var m = n.match(/-(\d+)(\.[^.]+)?$/); return m ? parseInt(m[1], 10) : NaN; }
              var na = tailNo(a), nb = tailNo(b);
              var aHas = !isNaN(na), bHas = !isNaN(nb);
              if (aHas !== bHas) return aHas ? -1 : 1;
              if (aHas && bHas && na !== nb) return na - nb;
              return a < b ? -1 : (a > b ? 1 : 0);
            });
            
            // 如果没有专门名为 thumb 的图片，则降级使用第一张图片作为封面保证页面不崩溃
            let finalThumb = thumbFilename;
            if (!finalThumb && images.length > 0) {
              finalThumb = images[0]; 
            }
              
            const coverImg = finalThumb 
              ? `${rawBase}/${encRel(rel)}/${encodeURIComponent(finalThumb)}?t=${CACHE_STAMP}` 
              : '';
              
            const cardName = folderName.includes('-')
              ? folderName.split('-').slice(1).join('-')
              : folderName;

            if (coverImg) {
              productsByCat[catKey].push({ folderName: folderName, rel: rel, cardName: cardName, coverImg: coverImg, images: images, infoUrl: infoUrl, infoType: infoType });
            }
          }
        }
        CAT_ORDER.forEach(function (k) {
          productsByCat[k].sort(function (a, b) { return a.folderName.localeCompare(b.folderName, 'zh'); });
        });
        updateDoorMetas();
        loadingElement.style.display = 'none';
        routeByHash(true);
      } catch (error) {
        loadingElement.innerHTML = '⚠ 数据读取失败。';
        document.getElementById('meta-tea').textContent = '展厅数据读取失败';
        document.getElementById('meta-clay').textContent = '展厅数据读取失败';
      }
    }
    
    function createCard(rel, folderName, cardName, coverUrl, allImages, infoUrl, infoType) {
      const gallery = document.getElementById('gallery');
      const card = document.createElement('div');
      card.className = 'product-card';
      
      card.innerHTML = `
        <img src="${coverUrl}" alt="${cardName}" loading="lazy" decoding="async">
        <div class="product-info"><h3 class="serif">${cardName}</h3></div>
      `;
      
      // 绑定滑动进入屏幕预加载
      if (allImages && allImages.length > 0) {
        card.dataset.folder = folderName;
        card.dataset.rel = rel;
        card.dataset.firstImage = allImages[0];
        galleryPreloadObserver.observe(card);

        // 绑定鼠标悬停或触碰预加载（意图预判：此时用户极可能马上点击）
        const prefetchIntent = () => {
          preloadImage(`${rawBase}/${encRel(rel)}/${encodeURIComponent(allImages[0])}?t=${CACHE_STAMP}`);
        };
        card.addEventListener('mouseenter', prefetchIntent, {once: true});
        card.addEventListener('touchstart', prefetchIntent, {once: true, passive: true});
      }

      card.onclick = () => openModal(rel, folderName, cardName, allImages, infoUrl, infoType);
      gallery.appendChild(card);
    }
    
    async function openModal(rel, folderName, fallbackName, images, infoUrl, infoType) {
      currentModalFolder = folderName;
      if (decodeURIComponent(window.location.hash.substring(1)) !== folderName) {
        window.history.pushState(null, '', '#' + encodeURIComponent(folderName));
      }
      
      const modal = document.getElementById('product-modal');
      const dynamicBox = document.getElementById('modal-dynamic-box');
      
      modal.style.display = 'block';
      document.body.style.overflow = 'hidden';
      
      let docTitle = fallbackName;
      let bodyHTML = '';
      let isSold = false;
      
      if (infoUrl) {
        try {
          const res = await fetch(`${infoUrl}?t=${CACHE_STAMP}`);
          const buffer = await res.arrayBuffer();
          const text = new TextDecoder('utf-8').decode(buffer);
          
          isSold = text.includes('已结缘');
          const lines = text.replace(/\r\n/g, '\n').replace(/\r/g, '\n').split('\n');
          const rawTitle = lines[0].replace(/^#+\s*/, '').replace(/[*_~`]/g, '').trim();
          if (rawTitle) docTitle = rawTitle;
          
          const bodyText = lines.slice(1).join('\n').trim();
          
          if (infoType === 'md') {
            bodyHTML = `<div class="md-body">${renderMarkdown(bodyText)}</div>`;
          } else {
            bodyHTML = `<div class="txt-body">${escapeHtml(bodyText)}</div>`;
          }
        } catch (e) {
          bodyHTML = '<div class="txt-body">（详见图片展示）</div>';
        }
      } else {
        bodyHTML = '<div class="txt-body">（详见图片展示）</div>';
      }
      
      const stampHero = isSold ? `<img src="${stampCDNUrl}?t=${CACHE_STAMP}" onerror="this.onerror=null; this.src='products/yinzhang.png';" class="sold-stamp-hero" alt="已售出">` : '';
      
      let wechatBtnHTML = '';
      if (isSold) {
        wechatBtnHTML = `<div class="btn-wechat btn-sold-status" onclick="copyWechat()">已售出 · 微信 CJQ678<span class="hint">（点击复制）</span></div>`;
      } else {
        wechatBtnHTML = `<div class="btn-wechat" onclick="copyWechat()">微信号 CJQ678<span class="hint">（点击复制）</span></div>`;
      }
      
      const firstImgSrc = images.length > 0 ? `${rawBase}/${encRel(rel)}/${encodeURIComponent(images[0])}?t=${CACHE_STAMP}` : '';
      
      let restImgsHTML = '';
      for (let i = 1; i < images.length; i++) {
        const src = `${rawBase}/${encRel(rel)}/${encodeURIComponent(images[i])}?t=${CACHE_STAMP}`;
        restImgsHTML += `<img src="${src}" loading="lazy" decoding="async" onclick="openLightbox(this.src)">`;
      }
      
      dynamicBox.innerHTML = `
        <div class="modal-content-dynamic">
          <div class="detail-hero-wrapper">
            ${firstImgSrc ? `<img src="${firstImgSrc}" decoding="async" onclick="openLightbox(this.src)">` : ''}
            ${stampHero}
          </div>
          <div class="detail-text-card">
            <h2 class="serif main-title">${escapeHtml(docTitle)}</h2>
            ${bodyHTML}
            <div class="btn-row">
              ${wechatBtnHTML}
            </div>
          </div>
          <div class="detail-images-list">${restImgsHTML}</div>
          <div class="end-of-content">· 观止 ·</div>
        </div>
      `;

      // 当用户已经打开详情页时，后台静默将此页面的剩余图片预先拉取下来
      // 等用户看完文字下滑时，所有图片直接从本地缓存秒渲染
      setTimeout(() => {
        for (let i = 1; i < images.length; i++) {
           preloadImage(`${rawBase}/${encRel(rel)}/${encodeURIComponent(images[i])}?t=${CACHE_STAMP}`);
        }
      }, 400); 
    }
    
    function escapeHtml(str) {
      return str.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
    }
    
    function closeModal() {
      currentModalFolder = null;
      document.getElementById('product-modal').style.display = 'none';
      document.body.style.overflow = 'auto';
      
      const hideHomeStyle = document.getElementById('hide-home-style');
      if (hideHomeStyle) hideHomeStyle.remove();
      
      if (currentCat) {
        openCategory(currentCat);
      } else if (window.location.hash) {
        window.history.pushState(null, '', window.location.pathname + window.location.search);
      }
    }
    
    window.addEventListener('popstate', () => {
      routeByHash(false);
    });
    
    // ─────────────────────────────────────────
    // 终极灯箱缩放引擎
    // ─────────────────────────────────────────
    const lightbox = document.getElementById('lightbox');
    const lbImg = document.getElementById('lightbox-img');
    
    let lbScale = 1, currentX = 0, currentY = 0;
    let isDragging = false, hasMoved = false, isZooming = false;
    let startX = 0, startY = 0, initialX = 0, initialY = 0;
    let lbInitDist = 0, lbInitScale = 1;
    let interactionLock = false;
    let lastTouchWasZoom = false;
    
    function setTransition(slow) {
      if (slow) {
        lbImg.style.transition = 'transform 1.5s cubic-bezier(0.1, 0.8, 0.2, 1)';
      } else {
        lbImg.style.transition = 'transform 0.2s cubic-bezier(0.25, 0.46, 0.45, 0.94)';
      }
    }
    
    function updateTransform() {
      lbImg.style.transform = `translate(${currentX}px, ${currentY}px) scale(${lbScale})`;
    }
    
    function openLightbox(src) {
      lbImg.src = src;
      lightbox.style.display = 'flex';
      lbScale = 1; currentX = 0; currentY = 0;
      hasMoved = false; isZooming = false;
      interactionLock = false; lastTouchWasZoom = false;
      lbImg.style.transition = 'none';
      updateTransform();
      requestAnimationFrame(() => { setTransition(false); });
    }
    
    function closeLightbox() {
      lightbox.style.display = 'none';
    }
    
    document.addEventListener('mouseup', (e) => {
      if (lightbox.style.display !== 'flex') return;
      dragEnd(e);
    });
    
    lightbox.addEventListener('mousedown', dragStart);
    lightbox.addEventListener('touchstart', dragStart, { passive: false });
    
    function dragStart(e) {
      if (interactionLock) return;
      if (e.type === 'mousedown') e.preventDefault();
      
      if (e.type === 'touchstart' && e.touches.length >= 2) {
        isZooming = true; hasMoved = true; lastTouchWasZoom = true;
        lbInitDist = Math.hypot(e.touches[0].pageX - e.touches[1].pageX, e.touches[0].pageY - e.touches[1].pageY);
        lbInitScale = lbScale; lbImg.style.transition = 'none';
        return;
      }
      
      isDragging = true; hasMoved = false; isZooming = false;
      const clientX = e.type === 'touchstart' ? e.touches[0].clientX : e.clientX;
      const clientY = e.type === 'touchstart' ? e.touches[0].clientY : e.clientY;
      startX = clientX; startY = clientY; initialX = currentX; initialY = currentY;
      lbImg.style.transition = 'none';
    }
    
    lightbox.addEventListener('mousemove', dragMove);
    lightbox.addEventListener('touchmove', dragMove, { passive: false });
    
    function dragMove(e) {
      e.preventDefault();
      if (interactionLock) return;
      
      if (e.type === 'touchmove' && e.touches.length >= 2) {
        hasMoved = true; isZooming = true; lastTouchWasZoom = true;
        const dist = Math.hypot(e.touches[0].pageX - e.touches[1].pageX, e.touches[0].pageY - e.touches[1].pageY);
        lbScale = Math.max(0.3, Math.min(lbInitScale * (dist / lbInitDist), 5));
        lbImg.style.transition = 'none';
        updateTransform();
        return;
      }
      
      if (!isDragging) return;
      const clientX = e.type === 'touchmove' ? e.touches[0].clientX : e.clientX;
      const clientY = e.type === 'touchmove' ? e.touches[0].clientY : e.clientY;
      const dx = clientX - startX; const dy = clientY - startY;
      if (Math.abs(dx) > 3 || Math.abs(dy) > 3) hasMoved = true;
      currentX = initialX + dx; currentY = initialY + dy;
      updateTransform();
    }
    
    lightbox.addEventListener('touchend', dragEnd);
    
    function dragEnd(e) {
      if (lightbox.style.display !== 'flex') return;
      if (isZooming || lastTouchWasZoom) {
        interactionLock = true; setTimeout(() => { interactionLock = false; }, 250);
      }
      isDragging = false; isZooming = false;
      if (e.type === 'touchend' && e.touches.length > 0) return;
      
      if (lbScale < 0.6) {
        interactionLock = true; lbScale = 1; currentX = 0; currentY = 0;
        setTransition(true); updateTransform();
        setTimeout(() => { interactionLock = false; }, 1500); 
      } else {
        setTransition(false);
      }
      setTimeout(() => { lastTouchWasZoom = false; }, 300);
    }
    
    lightbox.addEventListener('click', (e) => {
      if (!hasMoved && !lastTouchWasZoom) closeLightbox();
      hasMoved = false;
    });
    
    lightbox.addEventListener('wheel', (e) => {
      e.preventDefault();
      if (interactionLock) return;
      
      lbImg.style.transition = 'none';
      if (lbScale < 1) lbScale += e.deltaY * -0.001; 
      else lbScale += e.deltaY * -0.003;
      
      lbScale = Math.max(0.3, Math.min(lbScale, 5));
      if (lbScale < 1) { currentX *= 0.85; currentY *= 0.85; }
      updateTransform();
      
      clearTimeout(window.wheelTimeout);
      window.wheelTimeout = setTimeout(() => {
        if (lbScale < 0.6) {
          interactionLock = true; lbScale = 1; currentX = 0; currentY = 0;
          setTransition(true); updateTransform();
          setTimeout(() => { interactionLock = false; }, 1500); 
        }
      }, 150);
    }, { passive: false });
    
    // ─────────────────────────────────────────
    // 复制微信号 (统一字母大写)
    // ─────────────────────────────────────────
    function copyWechat() {
      const wechatId = "CJQ678";
      if (navigator.clipboard && window.isSecureContext) {
        navigator.clipboard.writeText(wechatId)
          .then(() => { alert("微信号 CJQ678 已复制！"); })
          .catch(() => { fallbackCopyTextToClipboard(wechatId); });
      } else {
        fallbackCopyTextToClipboard(wechatId);
      }
    }
    
    function fallbackCopyTextToClipboard(text) {
      const textArea = document.createElement("textarea");
      textArea.value = text; textArea.style.position = "fixed";
      document.body.appendChild(textArea); textArea.focus(); textArea.select();
      try { document.execCommand('copy'); alert("微信号 CJQ678 已复制！"); } 
      catch (err) { alert("请手动输入：CJQ678"); }
      document.body.removeChild(textArea);
    }
    
    initGallery();

    // 窑门交互：点门进入分类展厅
    document.getElementById('door-tea').addEventListener('click', function (e) { e.preventDefault(); openCategory('tea'); });
    document.getElementById('door-clay').addEventListener('click', function (e) { e.preventDefault(); openCategory('clay'); });
    document.getElementById('cat-back').addEventListener('click', function () { goHome(); });

    // 开窑仪式：帘幕向两侧拉开，火光与火星随之淡入
    document.addEventListener('DOMContentLoaded', function () { document.body.classList.add('ready'); });

    // 鼠标视差：探头看窑的纵深感
    (function () {
      var st = document.querySelector('.stage'), raf = null;
      window.addEventListener('mousemove', function (e) {
        if (raf) return;
        raf = requestAnimationFrame(function () {
          st.style.setProperty('--px', ((e.clientX / window.innerWidth - .5) * 2).toFixed(3));
          st.style.setProperty('--py', ((e.clientY / window.innerHeight - .5) * 2).toFixed(3));
          raf = null;
        });
      }, { passive: true });
    })();
  </script>
</body>
</html>
